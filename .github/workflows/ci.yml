name: build-and-test
# main is checked on push; other branches only through their pull request, so a PR doesn't run twice.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Bakes art/monsters/raw/ from src/monsters.js and runs svgo only on SVGs whose hash in
      # art/monsters/manifest.json changed, so an unchanged monster costs no svgo time.
      - name: Optimise changed monster SVGs
        run: npm run svg
      - run: npm run build
      - name: art/ and docs/ must match src/ (run "npm run build" and commit art/ and docs/)
        run: test -z "$(git status --porcelain -- art/ docs/)" || { git status --porcelain -- art/ docs/; git diff -- art/ docs/ | head -50; exit 1; }
      - run: npm test
      - run: npm run playtest
