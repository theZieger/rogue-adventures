name: build-and-test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: docs/ must match src/ (run "npm run build" and commit docs/)
        run: test -z "$(git status --porcelain -- docs/)" || { git status --porcelain -- docs/; git diff -- docs/ | head -50; exit 1; }
      - run: npm test
      - run: npm run playtest
