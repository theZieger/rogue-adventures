name: build-test-deploy
# main is checked on push; other branches only through their pull request, so a PR doesn't run twice.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      # svgo runs only on monsters whose hash in art/monsters/manifest.json changed, so art/ is committed.
      - name: art/ must match src/monsters.js (run "npm run build" and commit art/)
        run: test -z "$(git status --porcelain -- art/)" || { git status --porcelain -- art/; exit 1; }
      - run: npm test
      - run: npm run playtest
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with: { path: docs }
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
