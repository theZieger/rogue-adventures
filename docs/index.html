<style>
/* Self-hosted fonts. Andika carries all text and numbers: its 1/l/I and 6/9 can't be confused. */
@font-face { font-family: 'Andika'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/andika-400-latin.woff2) format('woff2'); }
@font-face { font-family: 'Andika'; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/andika-700-latin.woff2) format('woff2'); }
@font-face { font-family: 'Patrick Hand'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/patrickhand-latin.woff2) format('woff2'); }
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #1C2541;
  --bg2: #24305A;
  --card: #FFF9EE;
  --card2: #F3E9D2;
  --ink: #1C2541;
  --ink-soft: #4A5378;
  --paper-ink: #FFFFFF;
  --gold: #FFC93C;
  --green: #4FC96A;
  --red: #FF5A5A;
  --blue: #3FA0FF;
  --orange: #FF6A3D;
  --key: #2F3B6A;
  --key-ink: #FFFFFF;
  --focus: #FFC93C;
  --shadow: 0 6px 0 rgba(0,0,0,.25);
  --hand: 'Patrick Hand', 'Segoe Print', 'Comic Sans MS', cursive;
  --text: 'Andika', 'Verdana', 'Segoe UI', system-ui, sans-serif;
  --grid: #DCE5EE;
  color-scheme: dark;
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141B33; --bg2: #1C2749; } }
:root[data-theme="dark"] { --bg: #141B33; --bg2: #1C2749; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
body { height: 100%; margin: 0; overscroll-behavior: none; background: var(--bg); color: var(--paper-ink); font-family: var(--text); font-size: 19px; line-height: 1.35; -webkit-text-size-adjust: 100%; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }

#app { height: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.scroll { flex: 1; overflow-y: auto; padding: 14px 16px 24px; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--bg2); border-bottom: 3px solid rgba(255,255,255,.08); }
.topbar .title { font-family: var(--hand); font-size: 24px; flex: 1; }
.topbar .world { font-size: 16px; opacity: .85; }

h1, h2, h3 { margin: 0; line-height: 1.12; font-family: var(--hand); font-weight: 400; }
h1 { font-size: 50px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
p { margin: 8px 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 10px 20px; border: 3px solid var(--ink); border-radius: 18px; background: var(--gold); color: var(--ink); font-weight: 700; font-size: 21px; box-shadow: var(--shadow); cursor: pointer; width: 100%; text-align: center; }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.btn.secondary { background: #fff; border: 3px solid var(--ink); box-shadow: 0 6px 0 rgba(28,37,65,.35); }
.card .btn.secondary, .modal .btn.secondary { background: #fff; border: 3px solid var(--ink); }
.card .btn.small, .modal .btn.small { box-shadow: 0 4px 0 rgba(28,37,65,.35); }
.btn.ghost { background: transparent; color: var(--paper-ink); box-shadow: none; border: 3px solid rgba(255,255,255,.6); }
.btn.small { min-height: 44px; font-size: 17px; padding: 6px 14px; width: auto; border-radius: 14px; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* Title */
.hero { text-align: center; padding: 30px 16px 10px; }
.hero .logo { font-size: 72px; line-height: 1; }
.hero .sub { color: var(--gold); font-weight: 700; font-size: 20px; }

/* Cards */
.card { background: var(--card); color: var(--ink); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); }
.card h3 { color: var(--ink); }
.card.flat { box-shadow: none; }
.choice { background: var(--card); color: var(--ink); border: 3px solid var(--ink); border-radius: 22px; padding: 14px; display: flex; gap: 14px; align-items: center; text-align: left; width: 100%; cursor: pointer; box-shadow: var(--shadow); }
.choice:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.choice.selected { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold), var(--shadow); }
.choice .mon { width: 96px; height: 96px; flex: none; }
.choice .meta { flex: 1; }
.choice .meta .name { font-family: var(--hand); font-size: 28px; line-height: 1.1; }
.choice .meta .desc { font-size: 16px; color: var(--ink-soft); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 15px; font-weight: 700; color: #fff; }

/* Map */
.node { width: 78px; height: 78px; border-radius: 50%; border: 3px solid rgba(255,255,255,.5); background: var(--bg2); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 30px; line-height: 1; cursor: default; }
.node small { font-size: 11px; font-weight: 700; margin-top: 2px; }
.maphint { margin: 4px 0 0; font-size: 14px; line-height: 1.3; opacity: .85; text-align: center; }
.wmap { position: relative; width: 100%; max-width: 440px; margin: 14px auto 8px; }
.maplines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.maplines line { stroke: rgba(255,255,255,.4); stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.maplines line.walked { stroke: var(--green); stroke-dasharray: none; stroke-width: 4; }
.maplines line.next { stroke: var(--gold); stroke-width: 4; }
.maplines line.dead { opacity: .15; }
.wmap .node { position: absolute; transform: translate(-50%, -50%); width: 70px; height: 70px; font-size: 22px; }
.wmap .node.boss { width: 84px; height: 84px; font-size: 29px; }
.wmap .node small { font-size: 10.5px; white-space: nowrap; }
.node.open { border-color: var(--ink); background: var(--card); color: var(--ink); cursor: pointer; box-shadow: 0 0 0 3px var(--gold), var(--shadow); z-index: 1; }
.wmap .node.open:active { transform: translate(-50%, calc(-50% + 3px)); }
.node.taken { border-color: var(--green); }
.node.past { opacity: .3; }
.node.future { opacity: .7; }
.node.dead { opacity: .22; filter: grayscale(1); }
@media (max-width: 359px) { .wmap .node { width: 60px; height: 60px; font-size: 19px; } .wmap .node small { font-size: 9.5px; } }

/* Battle */
.arena { flex: 1 0 auto; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr auto; grid-template-areas: "eplate esprite" "gap gap" "hsprite hplate"; gap: 4px 10px; padding: 8px 14px 4px; align-items: end; }
.plate { background: var(--card); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; padding: 6px 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.plate.enemy { grid-area: eplate; align-self: start; }
.plate.hero { grid-area: hplate; }
.plate .name { font-family: var(--hand); font-size: 22px; line-height: 1.05; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.plateline { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.plate .hpbar { height: 14px; border-color: var(--ink); background: rgba(0,0,0,.18); }
.plate .hptext { font-size: 14px; font-weight: 700; }
.plate .xpbar { height: 6px; background: rgba(0,0,0,.15); }
.sprite { position: relative; display: flex; justify-content: center; align-items: flex-end; min-width: 0; }
.sprite .mon { position: relative; z-index: 1; }
.sprite .ground { position: absolute; left: 50%; bottom: -2px; width: 78%; height: 22px; translate: -50% 0; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255,255,255,.22), rgba(255,255,255,.06) 60%, transparent 72%); }
.sprite.enemy { grid-area: esprite; }
.sprite.enemy .mon { width: 108px; height: 108px; transform: scaleX(-1); }
.sprite.hero { grid-area: hsprite; }
.sprite.hero .mon { width: 132px; height: 132px; }
.hpbar { width: 100%; height: 18px; background: rgba(0,0,0,.35); border-radius: 999px; overflow: hidden; border: 2px solid rgba(255,255,255,.25); }
.hpbar i { display: block; height: 100%; background: var(--green); border-radius: 999px; transition: width .35s; }
.hpbar i.mid { background: var(--gold); } .hpbar i.low { background: var(--red); }
.hptext { font-size: 15px; font-weight: 700; }
.log { margin: 6px 14px 8px; min-height: 48px; padding: 8px 14px; background: var(--card); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; font-family: var(--hand); font-size: 23px; line-height: 1.15; text-align: left; box-shadow: var(--shadow); }
.log.hit { color: #1C6B2E; } .log.miss { color: #A42020; } .log.crit { color: #7A5300; }

.bottom { background: var(--bg2); border-top: 3px solid rgba(255,255,255,.08); padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); flex: none; }
.attacks { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 10px; }
.atk { background: var(--card); color: var(--ink); border: 3px solid var(--ink); border-radius: 18px; padding: 10px 12px; text-align: left; box-shadow: var(--shadow); cursor: pointer; min-height: 92px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.atk:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.atk .n { font-family: var(--hand); font-size: 23px; line-height: 1.1; }
.atk .m { font-size: 14px; color: var(--ink-soft); display: flex; gap: 6px; align-items: center; }
.atk .m .dmg { margin-left: auto; font-weight: 700; color: var(--ink); }
.atk.locked { opacity: .45; }

/* Task */
.taskwrap { flex: 1; overflow-y: auto; min-height: 0; padding: 8px 14px; display: flex; flex-direction: column; }
.taskwrap:empty { display: none; }
.task { background-color: var(--card); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; background-position: 11px 11px; color: var(--ink); border-radius: 22px; padding: 14px 16px; box-shadow: var(--shadow); position: relative; }
.task .head { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--ink-soft); font-weight: 700; }
.task .head .tut { margin-left: auto; min-height: 40px; min-width: 40px; border-radius: 999px; border: 3px solid var(--ink); background: #fff; color: var(--ink); font-weight: 700; font-size: 16px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.task .expr { font-size: 42px; font-weight: 700; text-align: center; margin: 10px 0 4px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.task .clues { font-size: 21px; font-weight: 700; margin: 10px 0; line-height: 1.4; }
.task .clues div::before { content: '• '; color: var(--orange); }
.task .seq { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; margin: 10px 0 4px; }
.task .prompt { text-align: center; color: var(--ink-soft); font-weight: 700; font-size: 17px; }
.inputs { display: flex; gap: 10px; justify-content: center; margin: 10px 0 4px; flex-wrap: wrap; align-items: center; }
.inp { min-width: 92px; height: 64px; border-radius: 16px; border: 4px solid var(--ink-soft); background: #fff; font-size: 34px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 12px; color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; }
.inp.active { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(63,160,255,.3); }
.inp.ok { border-color: var(--green); background: #E6F9EA; } .inp.bad { border-color: var(--red); background: #FFE8E8; }
.inp .lbl { position: absolute; }
.inpgroup { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 15px; font-weight: 700; color: var(--ink-soft); }
.nbline { display: flex; align-items: center; gap: 10px; justify-content: center; }
.nbline .mid { font-size: 40px; font-weight: 700; }
.grid { display: grid; grid-template-columns: repeat(3, 64px); gap: 6px; justify-content: center; margin: 10px 0; }
.grid div { width: 64px; height: 64px; border-radius: 12px; background: var(--card2); border: 3px solid #D9CBAA; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 24px; }
.grid div.start { background: #fff; border-color: var(--ink); }
.grid div.target { background: #FFF1B8; border-color: var(--gold); border-style: dashed; box-shadow: 0 0 0 3px rgba(255,201,60,.5); }
.legend { display: flex; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700; color: var(--ink-soft); flex-wrap: wrap; }
.legend span { background: var(--card2); border-radius: 10px; padding: 2px 8px; display: inline-flex; align-items: center; gap: 4px; }
.legend .arr { width: 16px; height: 16px; flex: none; color: var(--ink); }
.legend .arr-l { transform: rotate(180deg); } .legend .arr-d { transform: rotate(90deg); } .legend .arr-u { transform: rotate(-90deg); }

.numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.numpad button { min-height: 58px; border: 3px solid var(--ink); border-radius: 14px; background: var(--key); color: var(--key-ink); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; box-shadow: 0 4px 0 rgba(0,0,0,.3); cursor: pointer; }
.numpad button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
.numpad button.ok { background: var(--green); color: var(--ink); }
.numpad button.del { background: #5A3E6B; font-size: 24px; }
.numpad button.cancel { background: transparent; border: 3px solid rgba(255,255,255,.6); font-size: 18px; }

/* Overlay / modal */
.overlay { position: absolute; inset: 0; background: rgba(10,14,30,.72); display: flex; align-items: flex-end; justify-content: center; z-index: 20; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.modal { background: var(--card); color: var(--ink); border-radius: 24px; padding: 18px; width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; box-shadow: 0 10px 0 rgba(0,0,0,.3); }
.modal h2 { color: var(--ink); margin-bottom: 8px; }
.modal ol { padding-left: 24px; margin: 8px 0 14px; font-size: 19px; }
.modal ol li { margin: 8px 0; }
.modal .ex { background: var(--card2); border-radius: 14px; padding: 10px 12px; font-weight: 700; }

/* Feedback */
.feedback { text-align: center; padding: 8px 10px; border-radius: 18px; font-family: var(--hand); font-size: 28px; line-height: 1.1; margin-top: 10px; }
.feedback.good { background: #E6F9EA; color: #1C6B2E; }
.feedback.bad { background: #FFE8E8; color: #A42020; }
.feedback small { display: block; font-family: var(--text); font-size: 16px; font-weight: 700; margin-top: 2px; }

.items { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.item { background: var(--card); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; padding: 6px 12px; font-weight: 700; font-size: 16px; display: flex; gap: 6px; align-items: center; box-shadow: var(--shadow); cursor: pointer; min-height: 44px; }

.statrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 2px solid var(--card2); font-size: 17px; }
.statrow .n { flex: 1; font-weight: 700; }
.bar { width: 110px; height: 14px; border-radius: 999px; background: var(--card2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); }

.shake { animation: shake .35s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.pop { animation: pop .45s; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.hurt { animation: hurt .6s; }
@keyframes hurt { 0%,100% { filter: none; } 50% { filter: brightness(2) saturate(0); transform: translateX(-6px); } }
@media (prefers-reduced-motion: reduce) { .shake, .pop, .hurt { animation: none; } .hpbar i { transition: none; } }

.mon { display: block; }
.evo-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
.evo-row .mon { width: 104px; height: 104px; flex: none; }
.evo-row .mon.before { width: 80px; height: 80px; opacity: .75; }
.evo-row span { font-size: 28px; color: var(--ink-soft); }
.xpbar { height: 10px; background: rgba(0,0,0,.35); border-radius: 999px; overflow: hidden; width: 100%; }
.xpbar i { display: block; height: 100%; background: var(--blue); }
.center { text-align: center; }
.muted { opacity: .75; font-size: 16px; }
.levelbadge { background: var(--gold); color: var(--ink); border-radius: 999px; padding: 0 8px; font-size: 14px; font-weight: 700; }
.hidden { display: none !important; }
.parent-stats table { width: 100%; border-collapse: collapse; font-size: 15px; }
.parent-stats td, .parent-stats th { padding: 6px 4px; border-bottom: 2px solid var(--card2); text-align: left; }
@media (min-width: 500px) { body { font-size: 21px; } .sprite.hero .mon { width: 160px; height: 160px; } .sprite.enemy .mon { width: 130px; height: 130px; } .task .expr { font-size: 48px; } .grid { grid-template-columns: repeat(3, 76px); } .grid div { width: 76px; height: 76px; font-size: 28px; } }

/* Knowledge tasks */
.task .question { font-size: 22px; font-weight: 700; margin: 10px 0 6px; line-height: 1.35; }
.task .question .blank { display: inline-block; border-bottom: 4px solid var(--blue); padding: 0 6px; color: var(--blue); }
.options { display: grid; grid-template-columns: 1fr; gap: 8px; }
.options.two { grid-template-columns: 1fr 1fr; }
.opt { min-height: 56px; border: 3px solid var(--ink); border-radius: 16px; background: var(--card); color: var(--ink); font-weight: 700; font-size: 19px; padding: 8px 14px; box-shadow: var(--shadow); cursor: pointer; text-align: center; line-height: 1.25; }
.opt:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.opt.right { background: #CDEFD3; outline: 4px solid var(--green); }
.opt.wrong { background: #FFD6D6; outline: 4px solid var(--red); }
.orderlist { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
.oitem { display: flex; gap: 10px; align-items: center; text-align: left; border: 3px solid var(--ink); background: #fff; color: var(--ink); border-radius: 14px; padding: 8px 10px; font-weight: 700; font-size: 17px; cursor: pointer; min-height: 52px; }
.oitem .num { width: 32px; height: 32px; border-radius: 50%; background: var(--card2); display: inline-flex; align-items: center; justify-content: center; font-family: var(--hand); font-size: 20px; flex: none; }
.oitem.picked { border-color: var(--blue); background: #EAF4FF; }
.oitem.picked .num { background: var(--blue); color: #fff; }
.oitem.right { border-color: var(--green); background: #E6F9EA; }
.oitem.wrong { border-color: var(--red); background: #FFE8E8; }
.plant { width: 100%; max-width: 320px; height: auto; display: block; margin: 6px auto; }
.plant .part { transition: filter .2s; }
.plant .part.glow { filter: drop-shadow(0 0 6px #FFC93C) drop-shadow(0 0 10px #FFC93C); }
.plant .part.glow * { stroke: #E0A800; stroke-width: 3; }
.plant.clickable .part { cursor: pointer; }
.plant.clickable .part:hover, .plant.clickable .part:focus-visible { filter: drop-shadow(0 0 5px #3FA0FF); outline: none; }
.plant .part.reveal { filter: drop-shadow(0 0 6px #FFC93C) drop-shadow(0 0 10px #FFC93C); }
.plant .part.hit-part { filter: drop-shadow(0 0 8px #4FC96A); }
.plant .part.miss-part { filter: drop-shadow(0 0 8px #FF5A5A); }
.plant .plabel { font-size: 12px; font-weight: 700; font-family: var(--text); fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 3px; }
.modecard .desc { font-size: 15px; color: var(--ink-soft); }
.modecard .btn.small { flex: 1; }

/* Screen-reader-only text */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.choice[disabled] { opacity: .5; cursor: not-allowed; }

/* Task open in battle: arena collapses to one row so the task stays above the keypad */
.screen.tasking .arena { flex: none; grid-template-columns: 48px 1fr 48px 1fr; grid-template-rows: auto; grid-template-areas: "hsprite hplate esprite eplate"; gap: 6px; padding: 4px 14px 2px; align-items: center; }
.screen.tasking .plate { padding: 3px 8px; gap: 1px; border-width: 2px; box-shadow: none; }
.screen.tasking .plate.enemy { align-self: center; }
.screen.tasking .plate .name { font-size: 15px; }
.screen.tasking .plate .hptext, .screen.tasking .plateline, .screen.tasking .plate .xpbar, .screen.tasking .log, .screen.tasking .sprite .ground { display: none; }
.screen.tasking .plate .hpbar { height: 10px; }
.screen.tasking .sprite .mon { width: 48px; height: 48px; }

/* Short screens (small phones, phones held sideways): tighter keypad and task card */
@media (max-height: 720px) {
  .atk { min-height: 76px; padding: 6px 10px; } .atk .n { font-size: 20px; } .atk .m { font-size: 13px; } .atk .tags { min-height: 0; }
  .sprite.hero .mon { width: 104px; height: 104px; } .sprite.enemy .mon { width: 88px; height: 88px; }
  .log { min-height: 40px; font-size: 20px; padding: 6px 12px; margin: 4px 14px 6px; }
  .numpad { gap: 6px; }
  .numpad button { min-height: 48px; font-size: 24px; }
  .task { padding: 10px 14px; }
  .task .expr { font-size: 34px; margin: 4px 0 2px; }
  .task .seq { font-size: 28px; margin: 4px 0 2px; }
  .inp { height: 54px; font-size: 30px; }
  .inputs { margin: 6px 0 2px; }
  .taskwrap { padding: 6px 12px; }
}
@media (max-height: 600px) {
  .numpad button { min-height: 42px; font-size: 22px; }
  .bottom { padding: 6px 10px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); }
  .sprite.hero .mon { width: 96px; height: 96px; } .sprite.enemy .mon { width: 84px; height: 84px; }
  .atk { min-height: 70px; padding: 6px 10px; }
  .log { min-height: 36px; font-size: 19px; padding: 5px 10px; }
}
/* Phone held sideways: arena as one row, task and keypad side by side */
@media (max-height: 500px) and (orientation: landscape) {
  .arena { flex: none; grid-template-columns: 48px 1fr 48px 1fr; grid-template-rows: auto; grid-template-areas: "hsprite hplate esprite eplate"; gap: 8px; padding: 4px 14px 0; align-items: center; }
  .sprite .mon { width: 48px; height: 48px; } .sprite .ground { display: none; }
  .plate { padding: 3px 8px; gap: 1px; } .plate .name { font-size: 16px; } .plateline, .plate .xpbar { display: none; } .plate .hpbar { height: 10px; } .plate .hptext { font-size: 12px; }
  .log { min-height: 32px; font-size: 18px; padding: 4px 10px; margin: 4px 14px; }
  .attacks { grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .atk { min-height: 54px; padding: 4px 8px; } .atk .n { font-size: 18px; } .atk .m { font-size: 12px; } .atk .tags { min-height: 0; }
  .bottom { padding-top: 6px; } .bottom .row .muted { display: none; } .bottom .row { margin-top: 6px !important; }
  .screen.tasking { display: grid; grid-template-columns: 1fr minmax(240px, 38%); grid-template-rows: auto auto 1fr; }
  .screen.tasking > .topbar, .screen.tasking .arena { grid-column: 1 / -1; }
  .screen.tasking .taskwrap { grid-column: 1; grid-row: 3; }
  .screen.tasking .bottom { grid-column: 2; grid-row: 3; border-top: 0; border-left: 3px solid rgba(255,255,255,.08); display: flex; flex-direction: column; justify-content: center; overflow-y: auto; }
  .screen.tasking .numpad button { min-height: 40px; }
}

/* Attack tags */
.atk .tags { display: flex; flex-wrap: wrap; gap: 4px; min-height: 22px; }
.atk .tag { font-size: 13px; font-weight: 700; border-radius: 999px; padding: 0 8px; line-height: 20px; }
.atk .tag.tired { background: #FFE3D6; color: #8A2E0E; }
.atk .tag.power { background: #FFF1C7; color: #6B4E00; }
.atk.weak { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold), var(--shadow); }
.atk .tag.weak { background: var(--gold); color: var(--ink); }
.atk.tired { background: var(--card2); }
.hintline { margin: 6px 0; padding: 4px 10px; border-radius: 12px; background: #FFF1C7; color: #5A4300; font-weight: 700; font-size: 16px; text-align: center; }
.opt.struck { text-decoration: line-through; opacity: .45; }
.items { flex-direction: column; }
.item { flex-direction: column; align-items: flex-start; text-align: left; width: 100%; gap: 0; }
.item .count { display: inline-block; background: var(--gold); color: var(--ink); border-radius: 999px; padding: 0 8px; margin-left: 4px; font-size: 14px; }
.item small { font-weight: 600; font-size: 14px; color: var(--ink-soft); }

/* "Was ist neu?" */
.newbadge { display: inline-block; background: var(--orange); color: #fff; border-radius: 999px; padding: 0 8px; font-size: 14px; font-weight: 700; line-height: 22px; vertical-align: middle; }
.card.news h3 { margin-bottom: 4px; }
.card.news h4 { margin: 10px 0 2px; font-family: var(--hand); font-weight: 400; font-size: 21px; }
.card.news ul { margin: 0; padding-left: 22px; }
.card.news li { margin: 3px 0; line-height: 1.35; }
.ohelp { margin: 6px 0 0; font-size: 15px; color: var(--ink-soft); text-align: center; }

/* ---------- Title: grade & subject, sound toggle ---------- */
.soundbtn { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; width: 46px; height: 46px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); font-size: 21px; cursor: pointer; z-index: 2; }
.grades { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.gradechip { border: 3px solid rgba(255,255,255,.35); background: transparent; color: var(--paper-ink); border-radius: 999px; padding: 4px 16px; font: inherit; font-size: 17px; font-weight: 700; min-height: 44px; cursor: pointer; }
.gradechip.on { background: var(--gold); color: var(--ink); border-color: var(--ink); }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 2px; }
.screen { position: relative; }
.modecard .row .btn.small { min-width: 0; }

/* ---------- Starter: recommendation and practice swap ---------- */
.recbadge { display: inline-block; background: #FFF1C7; color: #6B4E00; border-radius: 999px; padding: 0 10px; font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.choice.swap { border-style: dashed; }
.choice.swap .tick { margin-left: auto; width: 34px; height: 34px; flex: none; border-radius: 10px; border: 3px solid var(--ink); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--green); background: #fff; }

/* ---------- Toggles (Elternbereich, Feedback) ---------- */
.toggles { display: flex; flex-wrap: wrap; gap: 8px; }
.toggle { border: 3px solid var(--ink-soft); background: #fff; color: var(--ink-soft); border-radius: 14px; padding: 6px 12px; min-height: 44px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
.toggle.on { border-color: var(--green); background: #E6F9EA; color: #1E6B32; }
.gatein { display: block; width: 100%; margin-top: 8px; border: 3px solid var(--ink-soft); border-radius: 14px; padding: 10px 12px; font: inherit; font-size: 24px; color: var(--ink); background: #fff; }
.textlink { align-self: center; color: var(--paper-ink); opacity: .8; font-size: 16px; padding: 6px 12px; }
a.btn { text-decoration: none; }
textarea#fbtext { width: 100%; margin-top: 10px; border: 3px solid var(--ink-soft); border-radius: 14px; padding: 10px 12px; font: inherit; font-size: 18px; color: var(--ink); background: #fff; resize: vertical; }
textarea#fbtext:focus, .gatein:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(63,160,255,.3); }

/* ---------- Look ---------- */
body { background-image: radial-gradient(900px 520px at 50% -12%, rgba(63,160,255,.14), transparent 65%), radial-gradient(700px 480px at 110% 110%, rgba(255,201,60,.07), transparent 60%); background-attachment: fixed; }
.btn, .choice, .atk, .opt, .oitem, .node, .item, .toggle, .gradechip { transition: transform .12s ease, box-shadow .12s ease, filter .15s ease, background-color .2s ease, border-color .2s ease; }
@media (hover: hover) { .btn:not(:disabled):hover, .choice:hover, .atk:hover, .opt:not(:disabled):hover, .oitem:hover, .item:hover, .toggle:hover, .gradechip:hover { filter: brightness(1.04); transform: translateY(-1px); } }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }

/* ---------- Motion ---------- */
.enter { animation: screenIn .22s ease-out both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.sprite .mon { animation: bob 3.2s ease-in-out infinite; }
.sprite#fe .mon { animation-delay: -1.6s; }
.hero .logo, .card.center > .mon, .choice.selected .mon { animation: bob 3.6s ease-in-out infinite; }
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -4px; } }
.floatnum { position: fixed; transform: translateX(-50%); font-family: var(--hand); font-size: 36px; color: #fff; text-shadow: 0 2px 0 var(--ink), 0 0 6px rgba(0,0,0,.4); pointer-events: none; animation: floatUp 2s ease-out forwards; z-index: 3; }
.floatnum.crit { color: var(--gold); font-size: 32px; }
@keyframes floatUp { 0% { opacity: 0; translate: 0 6px; } 10% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; translate: 0 -44px; } }
.node.open { animation: glow 2.4s ease-in-out infinite; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 3px var(--gold), var(--shadow); } 50% { box-shadow: 0 0 0 6px rgba(255,201,60,.55), var(--shadow); } }
.overlay .modal { animation: modalIn .2s ease-out both; }
@keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
.feedback.good { animation: pop .45s; }
.atk.tired .tag.tired { animation: none; }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 5; }
.confetti i { position: absolute; top: -12px; left: var(--x); width: 9px; height: 14px; border-radius: 3px; background: var(--c); opacity: 0; animation: fall 2.6s ease-in var(--d) 1 forwards; }
@keyframes fall { 0% { opacity: 0; transform: translateY(0) rotate(0); } 10% { opacity: 1; } 100% { opacity: 0; transform: translateY(85vh) rotate(320deg); } }
@media (prefers-reduced-motion: reduce) {
  .enter, .sprite .mon, .hero .logo, .card.center > .mon, .choice.selected .mon, .node.open, .overlay .modal, .feedback.good, .confetti i { animation: none; }
  .confetti { display: none; }
  .floatnum { animation: none; opacity: 1; }
  .btn, .choice, .atk, .opt, .oitem, .node, .item, .toggle, .gradechip { transition: none; }
}

.advantage { font-size: 13px; font-weight: 700; background: #DFF5E3; color: #1E6B32; border-radius: 999px; padding: 0 8px; line-height: 20px; }
@media (max-height: 720px) { .grid { grid-template-columns: repeat(3, 52px); gap: 5px; margin: 6px 0; } .grid div { width: 52px; height: 52px; font-size: 20px; } .legend { font-size: 13px; gap: 6px; } }
@media (max-height: 720px) and (min-width: 500px) { .grid { grid-template-columns: repeat(3, 56px); } .grid div { width: 56px; height: 56px; } }

.fbmsg { min-height: 1em; margin: 6px 0 0; font-weight: 700; color: var(--ink); }
.fbmsg a { color: var(--blue); }
.row .btn.small { white-space: nowrap; }

<body>
<div id="app"></div>
<script>
const MQ = (() => {
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  /* ---------- Modules ---------- */
  const MODULES = {
    add: { name: 'Addition', icon: '➕', maxTier: 5, worldCap: [2, 4, 5], dmg: 10 },
    sub: { name: 'Subtraktion', icon: '➖', maxTier: 5, worldCap: [2, 4, 5], dmg: 12 },
    mul: { name: 'Einmaleins', icon: '✖️', maxTier: 3, worldCap: [2, 3, 3], dmg: 12 },
    riddle: { name: 'Zahlenrätsel', icon: '🔍', maxTier: 3, worldCap: [1, 2, 3], dmg: 16 },
    seq: { name: 'Zahlenfolgen', icon: '🔢', maxTier: 4, worldCap: [2, 3, 4], dmg: 14 },
    nb: { name: 'Nachbarzahlen', icon: '↔️', maxTier: 3, worldCap: [1, 2, 3], dmg: 10 },
    grid: { name: 'Zahlengitter', icon: '🧩', maxTier: 3, worldCap: [1, 2, 3], dmg: 16 },
  };
  const MODULE_KEYS = Object.keys(MODULES);

  /* ---------- Generators ---------- */
  function genAdd(t) {
    let a, b, c;
    if (t === 1) { do { a = rnd(10, 89); b = rnd(3, 89 - a + 10); } while (a + b > 99 || (a % 10) + (b % 10) > 9); return task(`${a} + ${b} = ?`, [a + b]); }
    if (t === 2) { do { a = rnd(11, 88); b = rnd(2, 99 - a); } while ((a % 10) + (b % 10) < 10 || a + b > 99); return task(`${a} + ${b} = ?`, [a + b]); }
    if (t === 3) { do { a = rnd(100, 899); b = rnd(10, 999 - a); } while ((a % 10) + (b % 10) > 9 || (Math.floor(a / 10) % 10) + (Math.floor(b / 10) % 10) > 9); return task(`${a} + ${b} = ?`, [a + b]); }
    if (t === 4) { do { a = rnd(100, 899); b = rnd(10, 999 - a); } while ((a % 10) + (b % 10) < 10 && (Math.floor(a / 10) % 10) + (Math.floor(b / 10) % 10) < 10); return task(`${a} + ${b} = ?`, [a + b]); }
    do { a = rnd(50, 500); b = rnd(20, 300); c = rnd(5, 199); } while (a + b + c > 999); return task(`${a} + ${b} + ${c} = ?`, [a + b + c]);
  }
  function genSub(t) {
    let a, b;
    // tier 1: no ten-crossing (Einer reichen), b ≥ 2, result ≥ 2
    if (t === 1) { do { a = rnd(5, 19); b = rnd(2, 9); } while (a % 10 < b || a - b < 2); return task(`${a} − ${b} = ?`, [a - b]); }
    if (t === 2) { do { a = rnd(21, 99); b = rnd(2, 9); } while (a % 10 >= b || a % 10 === 0); return task(`${a} − ${b} = ?`, [a - b]); }
    if (t === 3) { do { a = rnd(30, 99); b = rnd(11, a - 1); } while (a % 10 >= b % 10); return task(`${a} − ${b} = ?`, [a - b]); }
    if (t === 4) { do { a = rnd(110, 999); b = rnd(5, 99); } while (a % 100 >= b % 100 && a % 10 >= b % 10); return task(`${a} − ${b} = ?`, [a - b]); }
    do { a = rnd(20, 99); b = rnd(2, 19); } while (a % 10 >= b % 10); return task(`${a} − ? = ${a - b}`, [b], { reverse: true });
  }
  function genMul(t) {
    if (t === 1) { const a = rnd(2, 5), b = rnd(2, 10); return task(`${a} · ${b} = ?`, [a * b]); }
    // tier 2 is still world 1 (results must stay under 100), so 10 · 10 is excluded
    if (t === 2) { let a, b; do { a = rnd(2, 10); b = rnd(2, 10); } while (a * b >= 100); return task(`${a} · ${b} = ?`, [a * b]); }
    const a = rnd(2, 10), b = rnd(2, 10); return task(`? · ${a} = ${a * b}`, [b], { reverse: true });
  }

  function digits(n) { return { h: Math.floor(n / 100) % 10, z: Math.floor(n / 10) % 10, e: n % 10 }; }
  const CLUE_TYPES_2 = [

    (d) => d.e < d.z ? { text: `Mein Einer ist um ${d.z - d.e} kleiner als mein Zehner.`, test: (x) => x.z - x.e === d.z - d.e } : null,

      return `<div class="task"><div class="head">${MODULES[mod].icon} ${MODULES[mod].name}${opts.subtitle ? ` · ${esc(opts.subtitle)}` : ''}<button class="tut" type="button" aria-label="Erklärung anzeigen">🛈 Wie geht das?</button></div>${body}${hint}${inputs}<div id="fb" role="status" aria-live="polite"></div></div>`;
    }
    container.innerHTML = cardHtml();
    bottom.innerHTML = `<div class="numpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((d) => `<button data-k="${d}">${d}</button>`).join('')}<button class="del" data-k="del" aria-label="Löschen">⌫</button><button data-k="0">0</button><button class="ok" data-k="ok" aria-label="Antwort prüfen">✓</button>${opts.cancel ? `<button class="cancel" data-k="cancel" style="grid-column:1/-1">Abbrechen</button>` : ''}</div>`;
    const inps = Array.from(container.querySelectorAll('.inp'));
    function paint() { inps.forEach((el, i) => { el.textContent = values[i]; el.classList.toggle('active', i === active && !locked); }); const a = inps[active]; if (a && a.scrollIntoView && !locked) a.scrollIntoView({ block: 'nearest' }); }
    inps.forEach((el) => { el.onclick = () => { if (!locked) { active = +el.dataset.i; paint(); } }; });
    $('.tut', container).onclick = () => showTutorial(task.group, task.note);
    paint();
    bottom.onclick = (e) => {
      const b = e.target.closest('button'); if (!b || locked || !bottom.contains(b) || !b.dataset.k) return; press(b.dataset.k);
    };
    keyHandler = (e) => {
      if (locked) return; let k = null;
      if (/^[0-9]$/.test(e.key)) k = e.key; else if (e.key === 'Backspace' || e.key === 'Delete') k = 'del'; else if (e.key === 'Enter') k = 'ok';
      else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && nAns > 1) { e.preventDefault(); active = (active + (e.key === 'ArrowLeft' ? nAns - 1 : 1)) % nAns; paint(); return; }
      if (!k) return; e.preventDefault(); press(k);
    };
    function press(k) {
      if (k === 'cancel') { done(null); return; }
      if (k === 'del') { values[active] = values[active].slice(0, -1); }
      else if (k === 'ok') {
        if (values.some((v) => v === '')) { const idx = values.findIndex((v) => v === ''); if (idx === active) return; active = idx; paint(); return; }
        submit(); return;
      }
      else { if (values[active].length < 3) values[active] += k; }
      paint();
    }
    function submit() {
      locked = true; keyHandler = null;
      const ok = values.every((v, i) => parseInt(v, 10) === task.answers[i]);
      if (opts.onResult) opts.onResult(ok); // game state changes now, so a reload can't undo the answer
      inps.forEach((el, i) => { el.classList.remove('active'); el.classList.add(parseInt(values[i], 10) === task.answers[i] ? 'ok' : 'bad'); });
      const fb = $('#fb', container);
      if (ok) { fb.innerHTML = `<div class="feedback good pop">Richtig! ✔</div>`; SFX.right(); }
      else { SFX.wrong(); const corr = task.answers.join(task.nb ? ' und ' : ', '); fb.innerHTML = `<div class="feedback bad ${reducedMotion ? '' : 'shake'}">Daneben<small>Richtig wäre: ${corr}</small></div>`; }
      if (fb.scrollIntoView) fb.scrollIntoView({ block: 'nearest' });
      bottom.innerHTML = `<button class="btn" id="next">Weiter</button>`;
      $('#next').focus();
      $('#next').onclick = () => done(ok);
    }
  }

  /* ---------- Choice / order / parts tasks ---------- */
  function runChoiceTask(task, opts, done) {
    const container = opts.container, bottom = opts.bottom; const M = MODULES_OF()[task.mod]; let locked = false;
    const head = `<div class="head">${M.icon} ${M.name}${opts.subtitle ? ` · ${esc(opts.subtitle)}` : ''}<button class="tut" type="button" aria-label="Erklärung anzeigen">🛈 Wie geht das?</button></div>`;
    // with two options crossing one out gives the answer away, so show the notes instead
    const strikeWrongOption = () => { if (task.options.length <= 2) { const n = task.note && CFG().notes ? CFG().notes[task.note] : null; $('#fb', container).insertAdjacentHTML('beforebegin', n ? `<div class="hintline">🌉 Tipp aus deinen Notizen „${esc(n.title)}“:<br>${n.lines.map((l) => esc(l)).join('<br>')}</div>` : '<div class="hintline">🌉 Tipp: Lies die Frage noch einmal ganz genau.</div>'); return; } const wrong = [...bottom.querySelectorAll('.opt')].filter((b) => task.options[+b.dataset.i] !== task.answer); const w = wrong[Math.floor(Math.random() * wrong.length)]; if (w) { w.disabled = true; w.classList.add('struck'); } $('#fb', container).insertAdjacentHTML('beforebegin', '<div class="hintline">🌉 Tipp: Eine falsche Antwort ist durchgestrichen.</div>'); };
    const finish = (ok, extraHtml) => {
      locked = true; const fb = $('#fb', container); if (ok) SFX.right(); else SFX.wrong();
      if (opts.onResult) opts.onResult(ok);
      fb.innerHTML = ok ? `<div class="feedback good pop">Richtig! ✔</div>` : `<div class="feedback bad ${reducedMotion ? '' : 'shake'}">Daneben<small>${extraHtml}</small></div>`;
      if (fb.scrollIntoView) fb.scrollIntoView({ block: 'nearest' });
      bottom.innerHTML = `<button class="btn" id="next">Weiter</button>`; $('#next').focus(); $('#next').onclick = () => done(ok);
    };
    if (task.kind === 'choice') {
      container.innerHTML = `<div class="task">${head}<div class="question">${esc(task.q).replace('___', '<span class="blank">____</span>')}</div><div id="fb" role="status" aria-live="polite"></div></div>`;
      bottom.innerHTML = `<div class="options ${task.cols === 2 ? 'two' : ''}">${task.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
      bottom.querySelectorAll('.opt').forEach((b) => { b.onclick = () => { if (locked) return; const ok = task.options[+b.dataset.i] === task.answer; b.classList.add(ok ? 'right' : 'wrong'); finish(ok, `Richtig wäre: ${esc(task.answer)}${task.why ? ' – ' + esc(task.why) : ''}`); }; });
      if (opts.hint) strikeWrongOption();
    } else if (task.kind === 'parts') {
      container.innerHTML = `<div class="task">${head}<div class="question">${esc(task.q)}</div>${potatoSVG({ highlight: task.part })}<div id="fb" role="status" aria-live="polite"></div></div>`;
      bottom.innerHTML = `<div class="options two">${task.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
      bottom.querySelectorAll('.opt').forEach((b) => { b.onclick = () => { if (locked) return; const ok = task.options[+b.dataset.i] === task.answer; b.classList.add(ok ? 'right' : 'wrong'); if (!ok) { const el = container.querySelector('[data-part="' + task.part + '"]'); if (el) el.classList.add('reveal'); } finish(ok, `Das ist: ${esc(task.answer)}`); }; });
      if (opts.hint) strikeWrongOption();
    } else if (task.kind === 'parts-find') {
      container.innerHTML = `<div class="task">${head}<div class="question">${esc(task.q)}</div>${potatoSVG({ clickable: true })}<div id="fb" role="status" aria-live="polite"></div></div>`;
      const pp = MK.PARTS.find((p) => p.id === task.part);
      bottom.innerHTML = `<p class="center muted" style="margin:6px 0">Tippe auf den Teil in der Pflanze.</p>${opts.hint && pp ? `<p class="center hintline">🌉 Tipp: Der Teil ist ${pp.ground === 'unten' ? 'unter' : 'über'} der Erde.</p>` : ''}`;
      container.querySelectorAll('[data-part]').forEach((g) => { g.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); g.onclick(); } }; g.onclick = () => { if (locked) return; const ok = g.dataset.part === task.part; g.classList.add(ok ? 'hit-part' : 'miss-part'); if (!ok) { const el = container.querySelector('[data-part="' + task.part + '"]'); if (el) el.classList.add('reveal'); } finish(ok, `Hier leuchtet jetzt: ${esc(task.answer)}`); }; });
    } else if (task.kind === 'order') {
      const chosen = opts.hint ? [task.order[0]] : []; const fixed = chosen.length;
      container.innerHTML = `<div class="task">${head}<div class="question">${esc(task.q)}</div><div class="orderlist" id="olist"></div><p class="ohelp">Tippe der Reihe nach. Nochmal tippen nimmt es wieder heraus.</p><div id="fb" role="status" aria-live="polite"></div></div>`;
      const paint = () => { $('#olist', container).innerHTML = task.display.map((it) => { const pos = chosen.indexOf(it.id); return `<button class="oitem ${pos >= 0 ? 'picked' : ''}" data-id="${it.id}" aria-pressed="${pos >= 0}" aria-label="${esc(it.text)}${pos >= 0 ? ', Platz ' + (pos + 1) : ''}"><span class="num">${pos >= 0 ? pos + 1 : ''}</span><span>${esc(it.text)}</span></button>`; }).join(''); container.querySelectorAll('.oitem').forEach((b) => { b.onclick = () => { if (locked) return; const pos = chosen.indexOf(b.dataset.id); if (pos >= fixed) chosen.splice(pos, 1); else if (pos < 0) chosen.push(b.dataset.id); paint(); }; }); /* tap again = take it out, the ones after it move up */ $('#ocheck').disabled = chosen.length !== task.order.length; $('#oundo').disabled = chosen.length <= fixed; };
      bottom.innerHTML = `<div class="row"><button class="btn secondary" id="oundo">↶ Rückgängig</button><button class="btn" id="ocheck">✓ Prüfen</button></div>`;
      $('#oundo').onclick = () => { if (!locked && chosen.length > fixed) { chosen.pop(); paint(); } };
      if (fixed) $('#olist', container).insertAdjacentHTML('afterend', '<div class="hintline">🌉 Tipp: Das Erste steht schon richtig.</div>');
      $('#ocheck').onclick = () => { if (locked || chosen.length !== task.order.length) return; const ok = chosen.every((id, i) => id === task.order[i]); const byId = Object.fromEntries(task.items.map((x) => [x.id, x.text])); container.querySelectorAll('.oitem').forEach((b) => { const i = chosen.indexOf(b.dataset.id); b.classList.add(task.order[i] === b.dataset.id ? 'right' : 'wrong'); }); finish(ok, 'Richtige Reihenfolge:<br>' + task.order.map((id, i) => `${i + 1}. ${esc(byId[id])}`).join('<br>')); };
      paint();
    }
    $('.tut', container).onclick = () => showTutorial(task.group, task.note);
  }

  /* ---------- Screens ---------- */

  /* ---------- Changelog (CHANGELOG.md via build.py) ---------- */

  function screenStarter() {
    let sel = CFG().starters.length === 1 ? CFG().starters[0].id : null;
    // recommend the monster whose attacks were practised least (and not the one played last time)
    const S = CFG().starters; const last = meta.lastStarter[mode];
    const score = (s) => s.attacks.reduce((n, a) => n + practice(a.mod), 0) + (s.id === last ? 1e6 : 0);
    const rec = S.length > 1 ? S.slice().sort((a, b) => score(a) - score(b))[0].id : null;
    // offer to swap the most practised attack for a task type that was hardly practised yet
    let swap = null, swapOn = true;
    const swapFor = (s) => { if (!s) return null; const have = s.attacks.map((a) => a.mod); const cand = enabledMods().filter((k) => !have.includes(k)).sort((a, b) => practice(a) - practice(b))[0]; const most = have.filter((k) => enabledMods().includes(k)).sort((a, b) => practice(b) - practice(a))[0];
      return cand && most && practice(most) >= practice(cand) + 3 ? { from: most, to: cand } : null; };
    const paintSwap = () => { const s = S.find((x) => x.id === sel); swap = swapFor(s); const box = $('#swapbox'); if (!box) return; const M = MODULES_OF();
      box.innerHTML = swap ? `<button class="choice swap ${swapOn ? 'selected' : ''}" id="swap" aria-pressed="${swapOn}"><div class="meta"><div class="name">🎯 Neues üben: ${M[swap.to].icon} ${M[swap.to].name}</div><div class="desc">Statt ${M[swap.from].name} (schon oft geübt) bekommst du die Attacke „${esc(CFG().extra[swap.to])}“. 🐝 Bonus: Fleißbienchen</div></div><span class="tick" aria-hidden="true">${swapOn ? '✔' : ''}</span></button>` : '';
      if (swap) $('#swap').onclick = () => { swapOn = !swapOn; paintSwap(); }; };
    render(`<div class="screen">${topbar(CFG().starters.length === 1 ? 'Dein Held' : 'Wähle dein Monster')}<div class="scroll"><div class="stack">
      ${CFG().starters.map((s) => `<button class="choice ${CFG().starters.length === 1 ? 'selected' : ''}" data-id="${s.id}">${monsterSVG(s.shape, TYPES[s.type].color, 0)}<div class="meta">${rec === s.id ? '<div class="recbadge">⭐ Empfohlen: übt Neues · 🐝 Bonus</div>' : ''}<div class="name">${s.names[0]}</div>${typeChip(s.type)}<div class="desc">${s.desc}<br>❤️ ${s.hp} LP · Attacken: ${[...new Set(s.attacks.map((a) => MODULES_OF()[a.mod].name))].join(', ')}</div></div></button>`).join('')}
      <div id="swapbox"></div>

  const NODE_INFO = { fight: ['⚔️', 'Kampf'], elite: ['💀', 'Elite'], event: ['❓', 'Ereignis'], rest: ['🔥', 'Rast'], treasure: ['🎁', 'Schatz'], boss: ['👑', 'Boss'], school: ['✏️', 'Zeichenschule'] };

  // Repeating an attack makes it tired; the weak spot moves to the least-practised attack after each hit.

  function chooseAttack(b, atk) {

  const LOOT = { normal: ['beere', 'beere', 'trank', 'keks', 'lupe', 'stern'], boss: ['engel', 'keks', 'schild'], chest: ['trank', 'schild', 'keks', 'lupe', 'engel', 'stern'], rare: ['engel', 'grosstrank', 'schild'] };
  function battleWon(b) {

    if (!gateOk) return screenGate(back);
    render(`<div class="screen">${topbar('Idee oder Fehler melden')}<div class="scroll"><div class="card"><p style="margin-top:0">Hast du eine Idee, einen Wunsch oder einen Fehler gefunden? Schreib es hier auf!</p>
      <div class="toggles" role="group" aria-label="Was ist es?">${['💡 Idee', '🐞 Fehler', '❤️ Lob'].map((t, i) => `<button class="toggle ${i ? '' : 'on'}" data-kind="${t}" aria-pressed="${!i}">${t}</button>`).join('')}</div>
      <label for="fbtext" class="sr-only">Deine Nachricht</label><textarea id="fbtext" rows="6" maxlength="2000" placeholder="Zum Beispiel: Ich wünsche mir Aufgaben zum Einmaleins mit 7 …"></textarea>
      <p class="muted" style="color:var(--ink-soft);font-size:15px">Bitte keine Namen, Adressen oder Telefonnummern hineinschreiben.</p><p id="fbmsg" role="status" aria-live="polite" class="fbmsg"></p></div></div>
      <div class="bottom"><div class="stack"><button class="btn" id="fbsend">Absenden</button><button class="btn ghost" id="back">Zurück</button></div></div></div>`);
    let kind = '💡 Idee'; let sending = false;
    app.querySelectorAll('[data-kind]').forEach((b) => { b.onclick = () => { kind = b.dataset.kind; app.querySelectorAll('[data-kind]').forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); }); }; });
    const text = () => $('#fbtext').value.trim();
    const body = () => `${kind}: ${text()}\n\n(Lernquest, Version ${(document.querySelector('meta[name=app-version]') || {}).content || '?'})`;
    const formLink = () => `${FEEDBACK.form}/viewform?usp=pp_url&${FEEDBACK.entry}=${encodeURIComponent(body())}`;
    $('#back').onclick = () => back();
    $('#fbsend').onclick = async () => {
      if (sending) return;
      if (!text()) { $('#fbtext').focus(); $('#fbmsg').textContent = 'Bitte zuerst etwas hineinschreiben 🙂'; return; }
      sending = true; $('#fbsend').disabled = true; $('#fbsend').textContent = 'Wird gesendet …';
      try {
        if (navigator.onLine === false) throw new Error('offline');
        // no-cors: the response can't be read, but the request arrives
        await fetch(`${FEEDBACK.form}/formResponse`, { method: 'POST', mode: 'no-cors', body: new URLSearchParams({ [FEEDBACK.entry]: body() }) });
        render(`<div class="screen">${topbar('Danke')}<div class="scroll"><div class="card center"><div style="font-size:56px" aria-hidden="true">💌</div><h2>Danke für deine Nachricht!</h2><p>Sie ist angekommen. Vielleicht steht deine Idee bald unter „Was ist neu?“.</p></div></div><div class="bottom"><button class="btn" id="back">Zurück</button></div></div>`);
        $('#back').onclick = () => back();
      } catch (e) {
        sending = false; $('#fbsend').disabled = false; $('#fbsend').textContent = 'Nochmal versuchen';
        $('#fbmsg').innerHTML = `Das hat nicht geklappt – bist du mit dem Internet verbunden? Dein Text bleibt hier stehen. <a href="${esc(formLink())}" target="_blank" rel="noopener">Oder im Formular senden ↗</a>`;
      }
    };
  }

  function screenGate(back) {
    const a = 12 + Math.floor(Math.random() * 8), b = 13 + Math.floor(Math.random() * 7);
    render(`<div class="screen">${topbar('Für Erwachsene')}<div class="scroll"><div class="card"><p style="margin-top:0">Deine Nachricht wird über das Internet verschickt. Bitte frag dafür einen Erwachsenen.</p>
      <label for="gatein" id="gateq"><b>Wie viel ist ${a} × ${b}?</b></label><input id="gatein" class="gatein" inputmode="numeric" pattern="[0-9]*" autocomplete="off"><p id="gatemsg" role="status" aria-live="polite" class="fbmsg"></p></div></div>
      <div class="bottom"><div class="stack"><button class="btn" id="gatego">Weiter</button><button class="btn ghost" id="back">Zurück</button></div></div></div>`);
    $('#back').onclick = () => back();
    const check = () => { if (+$('#gatein').value.trim() === a * b) { gateOk = true; screenFeedback(back); } else { $('#gatein').value = ''; $('#gatemsg').textContent = 'Das stimmt leider nicht.'; } };
    $('#gatego').onclick = check;
    $('#gatein').onkeydown = (e) => { if (e.key === 'Enter') check(); };
  }

  screenTitle();
  window.__mq = { get run() { return run; }, get meta() { return meta; }, get mode() { return mode; }, screenMap, screenTitle };
})();

</script>
<script>
(function () {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  const BUILD = 'ab0e5d89b841';
  const loadedAt = Date.now();
  let pending = false;
  function refresh(v) {
    try { if (sessionStorage.getItem('lq-reloaded') === v) return; sessionStorage.setItem('lq-reloaded', v); } catch (e) { }
    location.reload();
  }
  navigator.serviceWorker.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.type !== 'sw-activated' || d.version === BUILD) return;
    // update now only if just opened or in background, never mid-battle
    if (document.hidden || Date.now() - loadedAt < 8000) refresh(d.version); else pending = d.version;
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (pending) refresh(pending); return; }
    navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {});
  });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {}));
})();
</script>
</body>
</html>
