<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernquest – Mathe, Luther und Kartoffel</title>
<meta name="description" content="Roguelike-Lernspiel für Grundschüler: Mathe, Luther und Kartoffel. Funktioniert offline.">
<meta name="theme-color" content="#1C2541">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="application-name" content="Lernquest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernquest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="msapplication-TileColor" content="#1C2541">
<meta name="msapplication-TileImage" content="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #1C2541;
  --bg2: #24305A;
  --card: #FFF9EE;
  --card2: #F3E9D2;
  --ink: #1C2541;
  --ink-soft: #4A5378;
  --paper-ink: #FFFFFF;
  --gold: #FFC93C;
  --green: #4FC96A;
  --red: #FF5A5A;
  --blue: #3FA0FF;
  --orange: #FF6A3D;
  --key: #2F3B6A;
  --key-ink: #FFFFFF;
  --focus: #FFC93C;
  --shadow: 0 6px 0 rgba(0,0,0,.25);
  color-scheme: dark;
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141B33; --bg2: #1C2749; } }
:root[data-theme="dark"] { --bg: #141B33; --bg2: #1C2749; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
body { height: 100%; margin: 0; overscroll-behavior: none; background: var(--bg); color: var(--paper-ink); font-family: 'Baloo 2', 'Nunito', 'Segoe UI Rounded', 'Arial Rounded MT Bold', system-ui, sans-serif; font-size: 20px; line-height: 1.3; -webkit-text-size-adjust: 100%; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }

#app { height: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.scroll { flex: 1; overflow-y: auto; padding: 14px 16px 24px; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--bg2); border-bottom: 3px solid rgba(255,255,255,.08); }
.topbar .title { font-weight: 800; font-size: 20px; flex: 1; }
.topbar .world { font-size: 16px; opacity: .85; }

h1, h2, h3 { margin: 0; line-height: 1.15; }
h1 { font-size: 44px; font-weight: 800; letter-spacing: -.5px; }
h2 { font-size: 28px; font-weight: 800; }
h3 { font-size: 22px; font-weight: 700; }
p { margin: 8px 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 10px 20px; border: 3px solid var(--ink); border-radius: 18px; background: var(--gold); color: var(--ink); font-weight: 800; font-size: 21px; box-shadow: var(--shadow); cursor: pointer; width: 100%; text-align: center; }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.btn.secondary { background: #fff; border: 3px solid var(--ink); box-shadow: 0 6px 0 rgba(28,37,65,.35); }
.card .btn.secondary, .modal .btn.secondary { background: #fff; border: 3px solid var(--ink); }
.card .btn.small, .modal .btn.small { box-shadow: 0 4px 0 rgba(28,37,65,.35); }
.btn.ghost { background: transparent; color: var(--paper-ink); box-shadow: none; border: 3px solid rgba(255,255,255,.6); }
.btn.small { min-height: 44px; font-size: 17px; padding: 6px 14px; width: auto; border-radius: 14px; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* Title */
.hero { text-align: center; padding: 30px 16px 10px; }
.hero .logo { font-size: 72px; line-height: 1; }
.hero .sub { color: var(--gold); font-weight: 700; font-size: 22px; }

/* Cards */
.card { background: var(--card); color: var(--ink); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); }
.card h3 { color: var(--ink); }
.card.flat { box-shadow: none; }
.choice { background: var(--card); color: var(--ink); border: 3px solid var(--ink); border-radius: 22px; padding: 14px; display: flex; gap: 14px; align-items: center; text-align: left; width: 100%; cursor: pointer; box-shadow: var(--shadow); }
.choice:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.choice.selected { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold), var(--shadow); }
.choice .mon { width: 96px; height: 96px; flex: none; }
.choice .meta { flex: 1; }
.choice .meta .name { font-weight: 800; font-size: 24px; }
.choice .meta .desc { font-size: 16px; color: var(--ink-soft); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 15px; font-weight: 700; color: #fff; }

/* Map */
.map { display: flex; flex-direction: column-reverse; gap: 8px; padding: 10px 0; }
.floor { display: flex; justify-content: center; gap: 12px; align-items: center; padding: 6px; border-radius: 18px; }
.floor.current { background: rgba(255,201,60,.14); outline: 3px dashed var(--gold); }
.floor .num { width: 28px; font-size: 14px; opacity: .6; text-align: right; }
.node { width: 78px; height: 78px; border-radius: 50%; border: 3px solid rgba(255,255,255,.5); background: var(--bg2); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 30px; line-height: 1; cursor: default; }
.node small { font-size: 11px; font-weight: 700; margin-top: 2px; }
.floor.current .node { border-color: var(--ink); background: var(--card); color: var(--ink); cursor: pointer; box-shadow: 0 0 0 3px var(--gold), var(--shadow); }
.floor.current .node:active { transform: translateY(3px); }
.floor.done .node { opacity: .35; }
.floor.done .node.taken { opacity: 1; border-color: var(--green); }
.floor.future .node { opacity: .55; }

/* Battle */
.arena { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 6px 14px 2px; }
.fighter { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.fighter .mon { width: 88px; height: 88px; }
.fighter .mon.enemy { transform: scaleX(-1); }
.fighter .name { font-weight: 800; font-size: 19px; display: flex; gap: 6px; align-items: center; }
.hpbar { width: 100%; height: 18px; background: rgba(0,0,0,.35); border-radius: 999px; overflow: hidden; border: 2px solid rgba(255,255,255,.25); }
.hpbar i { display: block; height: 100%; background: var(--green); border-radius: 999px; transition: width .35s; }
.hpbar i.mid { background: var(--gold); } .hpbar i.low { background: var(--red); }
.hptext { font-size: 15px; font-weight: 700; }
.combo { display: flex; gap: 4px; margin-top: 2px; }
.combo b { width: 18px; height: 10px; border-radius: 4px; background: rgba(255,255,255,.2); }
.combo b.on { background: var(--gold); }
.log { min-height: 40px; padding: 4px 16px; text-align: center; font-weight: 700; font-size: 19px; }
.log.hit { color: var(--green); } .log.miss { color: var(--red); } .log.crit { color: var(--gold); }

.bottom { background: var(--bg2); border-top: 3px solid rgba(255,255,255,.08); padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); flex: none; }
.attacks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.atk { background: var(--card); color: var(--ink); border: 3px solid var(--ink); border-radius: 18px; padding: 10px 12px; text-align: left; box-shadow: var(--shadow); cursor: pointer; min-height: 72px; display: flex; flex-direction: column; justify-content: center; }
.atk:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.atk .n { font-weight: 800; font-size: 19px; }
.atk .m { font-size: 14px; color: var(--ink-soft); display: flex; gap: 6px; align-items: center; }
.atk .m .dmg { margin-left: auto; font-weight: 800; color: var(--ink); }
.atk.locked { opacity: .45; }

/* Task */
.taskwrap { flex: 1; overflow-y: auto; min-height: 0; padding: 8px 14px; display: flex; flex-direction: column; }
.task { background: var(--card); color: var(--ink); border-radius: 22px; padding: 14px 16px; box-shadow: var(--shadow); position: relative; }
.task .head { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--ink-soft); font-weight: 700; }
.task .head .tut { margin-left: auto; min-height: 40px; min-width: 40px; border-radius: 999px; border: 3px solid var(--ink); background: #fff; color: var(--ink); font-weight: 800; font-size: 16px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.task .expr { font-size: 40px; font-weight: 800; text-align: center; margin: 10px 0 4px; letter-spacing: 1px; }
.task .clues { font-size: 21px; font-weight: 700; margin: 10px 0; line-height: 1.4; }
.task .clues div::before { content: '• '; color: var(--orange); }
.task .seq { font-size: 34px; font-weight: 800; text-align: center; margin: 10px 0 4px; }
.task .prompt { text-align: center; color: var(--ink-soft); font-weight: 700; font-size: 17px; }
.inputs { display: flex; gap: 10px; justify-content: center; margin: 10px 0 4px; flex-wrap: wrap; align-items: center; }
.inp { min-width: 92px; height: 64px; border-radius: 16px; border: 4px solid var(--ink-soft); background: #fff; font-size: 34px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 12px; color: var(--ink); cursor: pointer; }
.inp.active { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(63,160,255,.3); }
.inp.ok { border-color: var(--green); background: #E6F9EA; } .inp.bad { border-color: var(--red); background: #FFE8E8; }
.inp .lbl { position: absolute; }
.inpgroup { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 15px; font-weight: 700; color: var(--ink-soft); }
.nbline { display: flex; align-items: center; gap: 10px; justify-content: center; }
.nbline .mid { font-size: 40px; font-weight: 800; }
.grid { display: grid; grid-template-columns: repeat(3, 64px); gap: 6px; justify-content: center; margin: 10px 0; }
.grid div { width: 64px; height: 64px; border-radius: 12px; background: var(--card2); border: 3px solid #D9CBAA; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 24px; }
.grid div.start { background: #fff; border-color: var(--ink); }
.grid div.target { background: #FFF1B8; border-color: var(--gold); border-style: dashed; box-shadow: 0 0 0 3px rgba(255,201,60,.5); }
.legend { display: flex; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700; color: var(--ink-soft); flex-wrap: wrap; }
.legend span { background: var(--card2); border-radius: 10px; padding: 2px 8px; }

.numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.numpad button { min-height: 58px; border: 3px solid var(--ink); border-radius: 14px; background: var(--key); color: var(--key-ink); font-size: 28px; font-weight: 800; box-shadow: 0 4px 0 rgba(0,0,0,.3); cursor: pointer; }
.numpad button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
.numpad button.ok { background: var(--green); color: var(--ink); }
.numpad button.del { background: #5A3E6B; font-size: 24px; }
.numpad button.cancel { background: transparent; border: 3px solid rgba(255,255,255,.6); font-size: 18px; }

/* Overlay / modal */
.overlay { position: absolute; inset: 0; background: rgba(10,14,30,.72); display: flex; align-items: flex-end; justify-content: center; z-index: 20; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.modal { background: var(--card); color: var(--ink); border-radius: 24px; padding: 18px; width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; box-shadow: 0 10px 0 rgba(0,0,0,.3); }
.modal h2 { color: var(--ink); margin-bottom: 8px; }
.modal ol { padding-left: 24px; margin: 8px 0 14px; font-size: 19px; }
.modal ol li { margin: 8px 0; }
.modal .ex { background: var(--card2); border-radius: 14px; padding: 10px 12px; font-weight: 700; }

/* Feedback */
.feedback { text-align: center; padding: 10px; border-radius: 18px; font-weight: 800; font-size: 24px; margin-top: 10px; }
.feedback.good { background: #E6F9EA; color: #1C6B2E; }
.feedback.bad { background: #FFE8E8; color: #A42020; }
.feedback small { display: block; font-size: 17px; font-weight: 700; margin-top: 2px; }

.items { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.item { background: var(--card); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; padding: 6px 12px; font-weight: 800; font-size: 16px; display: flex; gap: 6px; align-items: center; box-shadow: var(--shadow); cursor: pointer; min-height: 44px; }

.statrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 2px solid var(--card2); font-size: 17px; }
.statrow .n { flex: 1; font-weight: 700; }
.bar { width: 110px; height: 14px; border-radius: 999px; background: var(--card2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); }

.shake { animation: shake .35s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.pop { animation: pop .45s; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.hurt { animation: hurt .4s; }
@keyframes hurt { 0%,100% { filter: none; } 50% { filter: brightness(2) saturate(0); transform: translateX(-6px); } }
@media (prefers-reduced-motion: reduce) { .shake, .pop, .hurt { animation: none; } .hpbar i { transition: none; } }

.mon { display: block; }
.xpbar { height: 10px; background: rgba(0,0,0,.35); border-radius: 999px; overflow: hidden; width: 100%; }
.xpbar i { display: block; height: 100%; background: var(--blue); }
.center { text-align: center; }
.muted { opacity: .75; font-size: 16px; }
.levelbadge { background: var(--gold); color: var(--ink); border-radius: 999px; padding: 0 8px; font-size: 14px; font-weight: 800; }
.hidden { display: none !important; }
.parent-stats table { width: 100%; border-collapse: collapse; font-size: 15px; }
.parent-stats td, .parent-stats th { padding: 6px 4px; border-bottom: 2px solid var(--card2); text-align: left; }
@media (min-width: 500px) { body { font-size: 21px; } .fighter .mon { width: 140px; height: 140px; } .task .expr { font-size: 48px; } .grid { grid-template-columns: repeat(3, 76px); } .grid div { width: 76px; height: 76px; font-size: 28px; } }

/* Knowledge tasks */
.task .question { font-size: 22px; font-weight: 700; margin: 10px 0 6px; line-height: 1.35; }
.task .question .blank { display: inline-block; border-bottom: 4px solid var(--blue); padding: 0 6px; color: var(--blue); }
.options { display: grid; grid-template-columns: 1fr; gap: 8px; }
.options.two { grid-template-columns: 1fr 1fr; }
.opt { min-height: 56px; border: 3px solid var(--ink); border-radius: 16px; background: var(--card); color: var(--ink); font-weight: 800; font-size: 19px; padding: 8px 14px; box-shadow: var(--shadow); cursor: pointer; text-align: center; line-height: 1.25; }
.opt:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.opt.right { background: #CDEFD3; outline: 4px solid var(--green); }
.opt.wrong { background: #FFD6D6; outline: 4px solid var(--red); }
.orderlist { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
.oitem { display: flex; gap: 10px; align-items: center; text-align: left; border: 3px solid var(--ink); background: #fff; color: var(--ink); border-radius: 14px; padding: 8px 10px; font-weight: 700; font-size: 17px; cursor: pointer; min-height: 52px; }
.oitem .num { width: 32px; height: 32px; border-radius: 50%; background: var(--card2); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; flex: none; }
.oitem.picked { border-color: var(--blue); background: #EAF4FF; }
.oitem.picked .num { background: var(--blue); color: #fff; }
.oitem.right { border-color: var(--green); background: #E6F9EA; }
.oitem.wrong { border-color: var(--red); background: #FFE8E8; }
.plant { width: 100%; max-width: 320px; height: auto; display: block; margin: 6px auto; }
.plant .part { transition: filter .2s; }
.plant .part.glow { filter: drop-shadow(0 0 6px #FFC93C) drop-shadow(0 0 10px #FFC93C); }
.plant .part.glow * { stroke: #E0A800; stroke-width: 3; }
.plant.clickable .part { cursor: pointer; }
.plant.clickable .part:hover, .plant.clickable .part:focus-visible { filter: drop-shadow(0 0 5px #3FA0FF); outline: none; }
.plant .part.reveal { filter: drop-shadow(0 0 6px #FFC93C) drop-shadow(0 0 10px #FFC93C); }
.plant .part.hit-part { filter: drop-shadow(0 0 8px #4FC96A); }
.plant .part.miss-part { filter: drop-shadow(0 0 8px #FF5A5A); }
.plant .plabel { font-size: 12px; font-weight: 800; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 3px; }
.modecard .desc { font-size: 15px; color: var(--ink-soft); }
.modecard .btn.small { flex: 1; }

</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== MathQuest Logic (generators, data) ===== */
const MQ = (() => {
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  /* ---------- Modules ---------- */
  const MODULES = {
    add: { name: 'Addition', icon: '➕', maxTier: 5, worldCap: [2, 4, 5], dmg: 10 },
    sub: { name: 'Subtraktion', icon: '➖', maxTier: 5, worldCap: [2, 4, 5], dmg: 12 },
    mul: { name: 'Einmaleins', icon: '✖️', maxTier: 3, worldCap: [2, 3, 3], dmg: 12 },
    riddle: { name: 'Zahlenrätsel', icon: '🔍', maxTier: 3, worldCap: [1, 2, 3], dmg: 16 },
    seq: { name: 'Zahlenfolgen', icon: '🔢', maxTier: 4, worldCap: [2, 3, 4], dmg: 14 },
    nb: { name: 'Nachbarzahlen', icon: '↔️', maxTier: 3, worldCap: [1, 2, 3], dmg: 10 },
    grid: { name: 'Zahlengitter', icon: '🧩', maxTier: 3, worldCap: [1, 2, 3], dmg: 16 },
  };
  const MODULE_KEYS = Object.keys(MODULES);

  /* ---------- Generators ---------- */
  function genAdd(t) {
    let a, b, c;
    if (t === 1) { do { a = rnd(10, 89); b = rnd(3, 89 - a + 10); } while (a + b > 99 || (a % 10) + (b % 10) > 9); return task(`${a} + ${b} = ?`, [a + b]); }
    if (t === 2) { do { a = rnd(11, 88); b = rnd(2, 99 - a); } while ((a % 10) + (b % 10) < 10 || a + b > 99); return task(`${a} + ${b} = ?`, [a + b]); }
    if (t === 3) { do { a = rnd(100, 899); b = rnd(10, 999 - a); } while ((a % 10) + (b % 10) > 9 || (Math.floor(a / 10) % 10) + (Math.floor(b / 10) % 10) > 9); return task(`${a} + ${b} = ?`, [a + b]); }
    if (t === 4) { do { a = rnd(100, 899); b = rnd(10, 999 - a); } while ((a % 10) + (b % 10) < 10 && (Math.floor(a / 10) % 10) + (Math.floor(b / 10) % 10) < 10); return task(`${a} + ${b} = ?`, [a + b]); }
    do { a = rnd(50, 500); b = rnd(20, 300); c = rnd(5, 199); } while (a + b + c > 999); return task(`${a} + ${b} + ${c} = ?`, [a + b + c]);
  }
  function genSub(t) {
    let a, b;
    if (t === 1) { a = rnd(5, 19); b = rnd(1, Math.min(9, a - 1)); return task(`${a} − ${b} = ?`, [a - b]); }
    if (t === 2) { do { a = rnd(21, 99); b = rnd(2, 9); } while (a % 10 >= b || a % 10 === 0); return task(`${a} − ${b} = ?`, [a - b]); }
    if (t === 3) { do { a = rnd(30, 99); b = rnd(11, a - 1); } while (a % 10 >= b % 10); return task(`${a} − ${b} = ?`, [a - b]); }
    if (t === 4) { do { a = rnd(110, 999); b = rnd(5, 99); } while (a % 100 >= b % 100 && a % 10 >= b % 10); return task(`${a} − ${b} = ?`, [a - b]); }
    do { a = rnd(20, 99); b = rnd(2, 19); } while (a % 10 >= b % 10); return task(`${a} − ? = ${a - b}`, [b], { reverse: true });
  }
  function genMul(t) {
    if (t === 1) { const a = rnd(1, 5), b = rnd(1, 10); return task(`${a} · ${b} = ?`, [a * b]); }
    if (t === 2) { const a = rnd(2, 10), b = rnd(2, 10); return task(`${a} · ${b} = ?`, [a * b]); }
    const a = rnd(2, 10), b = rnd(2, 10); return task(`? · ${a} = ${a * b}`, [b], { reverse: true });
  }

  function digits(n) { return { h: Math.floor(n / 100) % 10, z: Math.floor(n / 10) % 10, e: n % 10 }; }
  const CLUE_TYPES_2 = [

  function weightedPick(items, know, seqNow) {
    const w = items.map((it) => { const k = know[it.id]; if (!k) return 4; let x = 1 + k.ws * 3; if (k.t > 0 && k.c / k.t < 0.6) x += 2; if (seqNow - (k.last || 0) < 3) x *= 0.15; return x; });
    let total = w.reduce((a, b) => a + b, 0); let r = Math.random() * total;
    for (let i = 0; i < items.length; i++) { r -= w[i]; if (r <= 0) return items[i]; }
    return items[items.length - 1];
  }

    const cands = pool.filter((p) => p.mod === mod);

      return { kind: 'parts', mod, tier: 1, group: 'parts:1', note: 'teile', q: e.q, part: part.id, options, answer: part.name, qid: e.id };

    const sparkle = evo >= 1 ? `<path d="M12 18 L14 24 L20 26 L14 28 L12 34 L10 28 L4 26 L10 24 Z" fill="#FFC93C"/>` : '';

    return `<svg class="mon ${cls || ''}" viewBox="0 0 120 120" aria-hidden="true">${defs}${aura}${body}${crown}${sparkle}</svg>`;
  }

<script>
/* ===== MathQuest App ===== */
(() => {
  const { rnd, pick, shuffle, TYPES, BEATS, ENEMY_MOVES, ITEMS, makeMap } = MQ;
  const MODES = {
    math: { modules: MQ.MODULES, starters: MQ.STARTERS, extra: MQ.EXTRA_ATTACKS, enemies: MQ.ENEMIES, events: MQ.EVENTS, tut: null, worlds: 3, title: 'Zahlenquest', icon: '🧮', sub: 'Mathe: Rechnen und Zahlen' },
    ethik: MK.MODES.ethik,
    kartoffel: MK.MODES.kartoffel,
  };
  const MODE_KEYS = ['math', 'ethik', 'kartoffel'];
  let mode = 'math';
  const CFG = () => MODES[mode];
  const MODULES_OF = () => CFG().modules;
  const MODKEYS = () => Object.keys(CFG().modules);
  const $ = (sel, el) => (el || document).querySelector(sel);
  const app = $('#app');
  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ---------- Storage ---------- */
  const KEY_META = 'mathquest_meta_v2';
  const KEY_RUN_FOR = (m) => (m === 'math' ? 'mathquest_run_v1' : 'mathquest_run_' + m);
  function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* storage unavailable */ } }
  function clear(key) { try { localStorage.removeItem(key); } catch (e) { } }

  const emptyStats = (m) => Object.fromEntries(Object.keys(MODES[m].modules).map((k) => [k, { c: 0, t: 0, hist: [] }]));
  const defaultMeta = () => ({ runs: 0, wins: 0, dex: {}, seenTut: {}, stats: Object.fromEntries(MODE_KEYS.map((m) => [m, emptyStats(m)])), know: {}, knowSeq: 0, evoUnlocked: {}, bestWorld: 0 });
  let meta = Object.assign(defaultMeta(), load(KEY_META, {}));
  (function migrate() { const old = load('mathquest_meta_v1', null); if (old && !load(KEY_META, null)) { meta.runs = old.runs || 0; meta.wins = old.wins || 0; meta.dex = old.dex || {}; meta.bestWorld = old.bestWorld || 0; for (const k in (old.stats || {})) if (meta.stats.math[k]) meta.stats.math[k] = old.stats[k]; for (const k in (old.seenTut || {})) meta.seenTut['math:' + k] = true; save(KEY_META, meta); } })();
  for (const m of MODE_KEYS) { if (!meta.stats[m]) meta.stats[m] = emptyStats(m); for (const k of Object.keys(MODES[m].modules)) if (!meta.stats[m][k]) meta.stats[m][k] = { c: 0, t: 0, hist: [] }; }
  if (!meta.know) meta.know = {}; if (!meta.knowSeq) meta.knowSeq = 0;
  let run = null;
  const saveAll = () => { save(KEY_META, meta); if (run) save(KEY_RUN_FOR(run.mode), run); else clear(KEY_RUN_FOR(mode)); };

  /* ---------- Monster art ---------- */
  const monsterSVG = MONART.monsterSVG; const shade = MONART.shade;

  /* ---------- Helpers ---------- */
  const heroName = () => heroSpec().names[run.hero.evo];
  const heroSpec = () => CFG().starters.find((s) => s.id === run.hero.id);
  const STATS = () => meta.stats[mode];
  const tutKey = (k) => mode + ':' + k;
  const typeChip = (t) => `<span class="chip" style="background:${TYPES[t].color};color:#1C2541">${TYPES[t].icon} ${TYPES[t].name}</span>`;
  const xpNeeded = (lvl) => 20 + lvl * 15;
  function tierFor(mod) { const M = MODULES_OF()[mod]; const cap = M.worldCap[Math.min(run.world, M.worldCap.length) - 1]; return Math.max(1, Math.min(cap, run.tiers[mod] || 1)); }
  function recordAnswer(mod, ok, task) {
    const M = MODULES_OF()[mod]; const s = STATS()[mod]; s.t++; if (ok) s.c++; s.hist.push(ok ? 1 : 0); if (s.hist.length > 40) s.hist.shift();
    if (task && task.qid) { meta.knowSeq++; MK.record(meta.know, task.qid, ok, meta.knowSeq); }
    const recent = s.hist.slice(-6); const acc = recent.reduce((a, b) => a + b, 0) / recent.length;
    if (recent.length >= 6) { if (acc >= 0.85) { run.tiers[mod] = Math.min(M.maxTier, (run.tiers[mod] || 1) + 1); s.hist = []; } else if (acc < 0.5) { run.tiers[mod] = Math.max(1, (run.tiers[mod] || 1) - 1); s.hist = []; } }
  }
  function weakestModule() { let best = null, bestAcc = 2; for (const k of MODKEYS()) { const s = STATS()[k]; const acc = s.t === 0 ? 0.6 : s.c / s.t; if (acc < bestAcc) { bestAcc = acc; best = k; } } return best; }
  function makeTask(mod, tier, opts) {
    run.recent = run.recent || {}; const rec = run.recent[mod] = run.recent[mod] || [];
    let t, sig;
    for (let i = 0; i < 12; i++) {
      if (mode === 'math') { t = MQ.generate(mod, tier, opts); t.kind = 'num'; t.group = mod + ':' + t.tier; sig = t.grid ? JSON.stringify(t.grid) : t.text; }
      else { t = MK.generate(mode, mod, tier, meta.know, meta.knowSeq); sig = t.qid; }
      if (!rec.includes(sig)) break;
    }
    rec.push(sig); if (rec.length > 8) rec.shift();
    return t;
  }
  function heroAttacks() { const all = CFG().worldAttacks && run.world > 1; return run.hero.attacks.map((a, i) => Object.assign({}, a, { unlocked: all || run.hero.level >= [1, 3, 6, 10][i] })); }
  function gainXp(n) { run.hero.xp += n; let msgs = []; while (run.hero.xp >= xpNeeded(run.hero.level)) { run.hero.xp -= xpNeeded(run.hero.level); run.hero.level++; run.hero.maxHp += 8; run.hero.hp = Math.min(run.hero.maxHp, run.hero.hp + 8); msgs.push(`Level ${run.hero.level}!`); const idx = [1, 3, 6, 10].indexOf(run.hero.level); if (idx >= 0 && run.hero.attacks[idx]) msgs.push(`Neue Attacke: ${run.hero.attacks[idx].name}!`); } return msgs; }
  function heal(n) { run.hero.hp = Math.min(run.hero.maxHp, run.hero.hp + n); }

  /* ---------- Rendering primitives ---------- */
  function render(html) { app.innerHTML = html; }
  function topbar(title, extra) { return `<div class="topbar"><div class="title">${title}</div>${extra || ''}${run ? `<div class="world">${CFG().worlds > 1 ? `Welt ${run.world} · ` : ''}Etage ${run.floor}</div>` : ''}</div>`; }
  function modal(html) { const ov = document.createElement('div'); ov.className = 'overlay'; ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`; app.appendChild(ov); return ov; }

  /* ---------- Tutorials ---------- */
  function tutFor(group) { if (mode === 'math') { const [mod, tier] = group.split(':'); return Object.assign({ icon: MQ.MODULES[mod].icon }, MQ.TUT[mod][+tier] || MQ.TUT[mod][1]); } const t = CFG().tut[group]; const M = MODULES_OF()[group.split(':')[0]]; return Object.assign({ icon: M ? M.icon : '📖' }, t); }
  function showTutorial(group, note, onClose, auto) {
    const t = tutFor(group); const n = note && CFG().notes ? CFG().notes[note] : null;
    const ov = modal(`<h2>${t.icon} ${esc(t.title)}</h2><p class="muted" style="opacity:.8">${auto ? 'Das ist neu! So geht es:' : 'So geht es:'}</p><ol>${t.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>${n ? `<div class="ex"><div style="font-size:16px;color:var(--ink-soft)">📄 Aus deinen Notizen: ${esc(n.title)}</div>${n.lines.map((l) => `<div>• ${esc(l)}</div>`).join('')}</div>` : ''}<button class="btn" id="tutok" style="margin-top:12px">Verstanden!</button>`);
    $('#tutok', ov).focus();
    $('#tutok', ov).onclick = () => { ov.remove(); meta.seenTut[tutKey(group)] = true; if (note) meta.seenTut[tutKey('note:' + note)] = true; saveAll(); if (onClose) onClose(); };
  }
  function ensureTutorial(task, then) { const needGroup = !meta.seenTut[tutKey(task.group)]; const needNote = task.note && !meta.seenTut[tutKey('note:' + task.note)]; if (needGroup || needNote) showTutorial(task.group, task.note, then, true); else then(); }

  /* ---------- Task UI ---------- */
  // Renders a task card and numpad; calls done(ok)
  function runTask(task, opts, done) {
    opts = opts || {}; window.__task = task;
    if (task.kind !== 'num') return runChoiceTask(task, opts, done);
    const mod = task.mod; const nAns = task.answers.length; const MODULES = MODULES_OF();
    const values = Array(nAns).fill(''); let active = 0; let locked = false;
    const container = opts.container; const bottom = opts.bottom;
    const labelsFor = () => task.nb ? [`${task.nb} davor`, `${task.nb} danach`] : task.seq ? ['', '', ''] : [''];
    function cardHtml() {
      let body = '';
      if (task.riddle) body = `<div class="clues">${task.text.split('\n').map((c) => `<div>${esc(c)}</div>`).join('')}</div><div class="prompt">Welche Zahl bin ich?</div>`;
      else if (task.seq) body = `<div class="seq">${task.seq.join(', ')}, …</div><div class="prompt">Wie gehen die nächsten drei weiter?</div>`;
      else if (task.nb) body = `<div class="prompt">Welche ${task.nb}zahl kommt davor, welche danach?</div>`;
      else if (task.grid) { const g = task.grid; let cells = ''; for (let r = 0; r < g.size; r++) for (let c = 0; c < g.size; c++) { const isS = r === g.sr && c === g.sc, isT = r === g.tr && c === g.tc; cells += `<div class="${isS ? 'start' : ''}${isT ? ' target' : ''}">${isS ? g.base : isT ? '?' : ''}</div>`; } body = `<div class="grid">${cells}</div><div class="legend"><span>⬇ +${g.stepD}</span><span>⬆ −${g.stepD}</span><span>➡ +${g.stepR}</span><span>⬅ −${g.stepR}</span></div><div class="prompt">Welche Zahl steht im Zielfeld?</div>`; }
      else body = `<div class="expr">${esc(task.text)}</div>`;
      let inputs = '';
      if (task.nb) inputs = `<div class="nbline"><div class="inpgroup"><div class="inp" data-i="0"></div><span>davor</span></div><div class="mid">${task.n}</div><div class="inpgroup"><div class="inp" data-i="1"></div><span>danach</span></div></div>`;
      else inputs = `<div class="inputs">${task.answers.map((_, i) => `<div class="inp" data-i="${i}"></div>`).join('')}</div>`;
      return `<div class="task"><div class="head">${MODULES[mod].icon} ${MODULES[mod].name}${opts.subtitle ? ` · ${esc(opts.subtitle)}` : ''}<button class="tut" type="button" aria-label="Erklärung anzeigen">🛈 Wie geht das?</button></div>${body}${inputs}<div id="fb"></div></div>`;
    }
    container.innerHTML = cardHtml();
    bottom.innerHTML = `<div class="numpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((d) => `<button data-k="${d}">${d}</button>`).join('')}<button class="del" data-k="del" aria-label="Löschen">⌫</button><button data-k="0">0</button><button class="ok" data-k="ok" aria-label="Antwort prüfen">✓</button>${opts.cancel ? `<button class="cancel" data-k="cancel" style="grid-column:1/-1">Abbrechen</button>` : ''}</div>`;
    const inps = Array.from(container.querySelectorAll('.inp'));
    function paint() { inps.forEach((el, i) => { el.textContent = values[i]; el.classList.toggle('active', i === active && !locked); }); }
    inps.forEach((el) => { el.onclick = () => { if (!locked) { active = +el.dataset.i; paint(); } }; });
    $('.tut', container).onclick = () => showTutorial(task.group, task.note);
    paint();
    bottom.onclick = (e) => {
      const b = e.target.closest('button'); if (!b || locked || !bottom.contains(b) || !b.dataset.k) return; const k = b.dataset.k;
      if (k === 'cancel') { done(null); return; }
      if (k === 'del') { values[active] = values[active].slice(0, -1); }
      else if (k === 'ok') {
        if (values.some((v) => v === '')) { const idx = values.findIndex((v) => v === ''); if (idx === active) return; active = idx; paint(); return; }
        submit(); return;
      }
      else { if (values[active].length < 3) values[active] += k; }
      paint();
    };
    function submit() {
      locked = true;
      const ok = values.every((v, i) => parseInt(v, 10) === task.answers[i]);
      inps.forEach((el, i) => { el.classList.remove('active'); el.classList.add(parseInt(values[i], 10) === task.answers[i] ? 'ok' : 'bad'); });

      else { const corr = task.answers.join(task.nb ? ' und ' : ', '); fb.innerHTML = `<div class="feedback bad ${reducedMotion ? '' : 'shake'}">Daneben<small>Richtig wäre: ${corr}</small></div>`; }
      if (fb.scrollIntoView) fb.scrollIntoView({ block: 'nearest' });
      bottom.innerHTML = `<button class="btn" id="next">Weiter</button>`;
      $('#next').focus();
      $('#next').onclick = () => done(ok);
    }
  }

  /* ---------- Choice / order / parts tasks ---------- */
  function runChoiceTask(task, opts, done) {
    const container = opts.container, bottom = opts.bottom; const M = MODULES_OF()[task.mod]; let locked = false;
    const head = `<div class="head">${M.icon} ${M.name}${opts.subtitle ? ` · ${esc(opts.subtitle)}` : ''}<button class="tut" type="button" aria-label="Erklärung anzeigen">🛈 Wie geht das?</button></div>`;

      bottom.innerHTML = `<div class="options ${task.cols === 2 ? 'two' : ''}">${task.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
      bottom.querySelectorAll('.opt').forEach((b) => { b.onclick = () => { if (locked) return; const ok = task.options[+b.dataset.i] === task.answer; b.classList.add(ok ? 'right' : 'wrong'); finish(ok, `Richtig wäre: ${esc(task.answer)}${task.why ? ' – ' + esc(task.why) : ''}`); }; });
    } else if (task.kind === 'parts') {
      container.innerHTML = `<div class="task">${head}<div class="question">${esc(task.q)}</div>${potatoSVG({ highlight: task.part })}<div id="fb"></div></div>`;
      bottom.innerHTML = `<div class="options two">${task.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
      bottom.querySelectorAll('.opt').forEach((b) => { b.onclick = () => { if (locked) return; const ok = task.options[+b.dataset.i] === task.answer; b.classList.add(ok ? 'right' : 'wrong'); if (!ok) { const el = container.querySelector('[data-part="' + task.part + '"]'); if (el) el.classList.add('reveal'); } finish(ok, `Das ist: ${esc(task.answer)}`); }; });
    } else if (task.kind === 'parts-find') {

      bottom.innerHTML = `<p class="center muted" style="margin:6px 0">Tippe auf den Teil in der Pflanze.</p>`;

    } else if (task.kind === 'order') {
      const chosen = [];
      container.innerHTML = `<div class="task">${head}<div class="question">${esc(task.q)}</div><div class="orderlist" id="olist"></div><div id="fb"></div></div>`;
      const paint = () => { $('#olist', container).innerHTML = task.display.map((it) => { const pos = chosen.indexOf(it.id); return `<button class="oitem ${pos >= 0 ? 'picked' : ''}" data-id="${it.id}"><span class="num">${pos >= 0 ? pos + 1 : ''}</span><span>${esc(it.text)}</span></button>`; }).join(''); container.querySelectorAll('.oitem').forEach((b) => { b.onclick = () => { if (locked || chosen.includes(b.dataset.id)) return; chosen.push(b.dataset.id); paint(); }; }); $('#ocheck').disabled = chosen.length !== task.order.length; $('#oundo').disabled = chosen.length === 0; };

  /* ---------- Potato plant drawing ---------- */

  function enterNode(type) {

  function advance() { run.floor++; run.shield = false; if (run.floor > 8) { if (run.world >= CFG().worlds) { screenVictory(); return; } run.world++; run.floor = 1; run.map = makeMapFor(run.world); run.path = []; meta.bestWorld = Math.max(meta.bestWorld, run.world); if (CFG().worldAttacks && CFG().worldAttacks[run.world]) { run.hero.attacks = CFG().worldAttacks[run.world].map((x) => ({ name: x.name, mod: x.mod })); run.hero.combos = {}; } } saveAll(); screenMap(); }

  /* ---------- Battle ---------- */
  function startBattle(spec, hard) {

  function renderBattle(b) {

  function renderAttackChoice(b) {

    $('#bottom').innerHTML = `<div class="attacks">${atks.map((a, i) => { const eff = BEATS[heroType] === b.enemy.type; const combo = run.hero.combos[a.mod] || 0; return `<button class="atk ${a.unlocked ? '' : 'locked'}" data-i="${i}" ${a.unlocked ? '' : 'disabled'}><span class="n">${esc(a.name)}</span><span class="m">${MODULES[a.mod].icon} ${MODULES[a.mod].name}<span class="dmg">💥 ${MODULES[a.mod].dmg}${eff ? ' ×1,5' : ''}</span></span>${a.unlocked ? `<span class="combo" aria-label="Kombo ${combo} von 3">${[0, 1, 2].map((k) => `<b class="${k < combo ? 'on' : ''}"></b>`).join('')}</span>` : `<span class="m">🔒 ab Level ${[1, 3, 6, 10][i]}</span>`}</button>`; }).join('')}</div><div class="row" style="margin-top:8px"><button class="btn secondary small" id="bag">🎒 Beutel (${run.items.length})</button><span class="muted" style="align-self:center;font-size:14px">Kombo voll = Volltreffer</span></div>`;
    $('#bag').onclick = () => showBag((it) => { b.log = `${it.icon} ${it.name} benutzt!`; b.logCls = 'hit'; enemyTurn(b, 1); });
    app.querySelectorAll('.atk:not(.locked)').forEach((btn) => { btn.onclick = () => chooseAttack(b, atks[+btn.dataset.i]); });
  }
  function chooseAttack(b, atk) {
    const tier = tierFor(atk.mod); const MODULES = MODULES_OF();
    let t = makeTask(atk.mod, tier, { elite: b.enemy.elite || b.enemy.boss });
    b.phase = 'task';
    ensureTutorial(t, () => {
      runTask(t, { container: $('#taskwrap'), bottom: $('#bottom'), subtitle: atk.name }, (ok) => {
        recordAnswer(atk.mod, ok, t); const h = run.hero;
        if (ok) {
          let combo = (h.combos[atk.mod] || 0) + 1; let crit = false;
          if (combo >= 3) { crit = true; combo = 0; }
          h.combos[atk.mod] = combo;
          const eff = BEATS[heroSpec().type] === b.enemy.type;
          let dmg = MODULES[atk.mod].dmg + h.level * 2;
          if (eff) dmg = Math.round(dmg * 1.5);
          if (heroSpec().perk === 'crit' && !crit && Math.random() < 0.15) crit = true;
          if (crit) dmg *= 2;
          b.enemy.hp = Math.max(0, b.enemy.hp - dmg);
          if (heroSpec().perk === 'heal') heal(3);
          b.log = `${atk.name}: ${crit ? 'VOLLTREFFER! ' : eff ? 'Sehr effektiv! ' : 'Treffer! '}${dmg} Schaden`; b.logCls = crit ? 'crit' : 'hit';

  function enemyTurn(b, mult) {
    const h = run.hero; const move = pick(ENEMY_MOVES);

    else { let dmg = Math.round(b.enemy.atk * mult * (0.85 + Math.random() * 0.3)); if (BEATS[b.enemy.type] === heroSpec().type) dmg = Math.round(dmg * 1.25); if (heroSpec().perk === 'tank') dmg = Math.round(dmg * 0.85); dmg = Math.max(1, dmg); h.hp = Math.max(0, h.hp - dmg); b.log = `${b.enemy.name} greift mit ${move} an: ${dmg} Schaden${mult > 1 ? ' (freier Schlag)' : ''}`; b.logCls = 'miss'; }

  function battleWon(b) {

    saveAll();
    render(`<div class="screen">${topbar('Gewonnen!')}<div class="scroll"><div class="card center"><h2>🏆 ${esc(e.name)} besiegt!</h2><p>+${xp} XP${drop ? ` · ${ITEMS[drop].icon} ${ITEMS[drop].name} gefunden` : ''}</p>${msgs.map((m) => `<p style="color:var(--orange);font-weight:800">${m}</p>`).join('')}</div>${evoMsg}</div><div class="bottom"><button class="btn" id="next">${e.boss ? (run.world >= CFG().worlds ? 'Zum großen Finale' : 'Weiter zur nächsten Welt') : 'Weiter'}</button></div></div>`);

  /* ---------- Event ---------- */
  function screenEvent() {
    const ev = pick(CFG().events);
    render(`<div class="screen">${topbar('❓ Ereignis')}<div class="scroll"><div class="card"><h2>${esc(ev.title)}</h2><p style="font-size:20px">${esc(ev.text)}</p></div></div><div class="bottom"><div class="stack">${ev.opts.map((o, i) => `<button class="btn ${i ? 'secondary' : ''}" data-i="${i}">${esc(o.label)}</button>`).join('')}</div></div></div>`);
    app.querySelectorAll('.bottom .btn').forEach((btn) => { btn.onclick = () => { const o = ev.opts[+btn.dataset.i]; if (o.task) { const mod = o.task === 'any' ? pick(MODKEYS()) : o.task; const tier = tierFor(mod); const t = makeTask(mod, tier); render(`<div class="screen">${topbar('❓ ' + esc(ev.title))}<div class="taskwrap" id="taskwrap"></div><div class="bottom" id="bottom"></div></div>`); ensureTutorial(t, () => runTask(t, { container: $('#taskwrap'), bottom: $('#bottom') }, (ok) => { recordAnswer(mod, ok, t); applyEffect(ok ? o.win : o.lose, ok ? 'Geschafft!' : 'Leider daneben.'); })); } else applyEffect(o.effect, ev.title); }; });

  function applyEffect(eff, title) {

    if (eff.maxhp) { run.hero.maxHp += eff.maxhp; heal(eff.maxhp); lines.push(`💪 +${eff.maxhp} maximale Lebenspunkte`); }
    if (eff.item) { run.items.push(eff.item); lines.push(`${ITEMS[eff.item].icon} ${ITEMS[eff.item].name} erhalten`); }
    if (eff.xp) { const m = gainXp(eff.xp); lines.push(`⭐ +${eff.xp} XP`); lines.push(...m); }

    render(`<div class="screen">${topbar('❓ Ereignis')}<div class="scroll"><div class="card center"><h2>${esc(title)}</h2>${lines.map((l) => `<p>${l}</p>`).join('')}</div></div><div class="bottom"><button class="btn" id="next">Weiter</button></div></div>`);

  /* ---------- Rest ---------- */
  function screenRest() {
    const weak = weakestModule(); const s = STATS()[weak]; const acc = s.t ? Math.round((s.c / s.t) * 100) : null; const MODULES = MODULES_OF();
    render(`<div class="screen">${topbar('🔥 Rast')}<div class="scroll"><div class="card center"><h2>Am Lagerfeuer</h2>${monsterSVG(heroSpec().shape, TYPES[heroSpec().type].color, run.hero.evo)}<p>❤️ ${run.hero.hp} / ${run.hero.maxHp}</p></div></div>
      <div class="bottom"><div class="stack"><button class="btn" id="heal">Ausruhen: +${Math.round(run.hero.maxHp * 0.4)} LP</button><button class="btn secondary" id="train">Training: ${MODULES[weak].icon} ${MODULES[weak].name}${acc !== null ? ` (${acc} % richtig)` : ''} – 3 Aufgaben, kein Risiko, +XP</button></div></div></div>`);

  }
  function training(mod, total, done) {
    if (done >= total) { const m = gainXp(15); saveAll(); render(`<div class="screen">${topbar('🔥 Training')}<div class="scroll"><div class="card center"><h2>Training geschafft!</h2><p>⭐ +15 XP</p>${m.map((x) => `<p style="color:var(--orange);font-weight:800">${x}</p>`).join('')}</div></div><div class="bottom"><button class="btn" id="next">Weiter</button></div></div>`); $('#next').onclick = advance; return; }
    const tier = tierFor(mod); const t = makeTask(mod, tier);
    render(`<div class="screen">${topbar(`🔥 Training ${done + 1} / ${total}`)}<div class="taskwrap" id="taskwrap"></div><div class="bottom" id="bottom"></div></div>`);
    const s = STATS()[mod]; const low = s.t >= 3 && s.c / s.t < 0.6;
    const go = () => runTask(t, { container: $('#taskwrap'), bottom: $('#bottom'), subtitle: 'Übung' }, (ok) => { recordAnswer(mod, ok, t); saveAll(); training(mod, total, done + 1); });
    if (low && done === 0 && meta.seenTut[tutKey(t.group)]) showTutorial(t.group, t.note, go); else ensureTutorial(t, go);
  }

  /* ---------- Treasure ---------- */
  function screenTreasure() {
    const owned = run.hero.attacks.map((a) => a.mod); const free = MODKEYS().filter((k) => !owned.includes(k)); const MODULES = MODULES_OF(); const EXTRA_ATTACKS = CFG().extra;
    const opts = [{ k: 'item', label: `${ITEMS.trank.icon} Trank`, desc: ITEMS.trank.desc }, { k: 'maxhp', label: '💪 +10 maximale LP', desc: 'Dein Monster wird zäher.' }];
    if (free.length) { const m = pick(free); opts.push({ k: 'atk', mod: m, label: `${MODULES[m].icon} Neue Attacke: ${EXTRA_ATTACKS[m]}`, desc: `${MODULES[m].name} – ersetzt eine deiner Attacken.` }); } else opts.push({ k: 'shield', label: `${ITEMS.schild.icon} Schild`, desc: ITEMS.schild.desc });
    render(`<div class="screen">${topbar('🎁 Schatz')}<div class="scroll"><p class="center">Du findest eine Truhe. Wähle eine Belohnung:</p><div class="stack">${opts.map((o, i) => `<button class="choice" data-i="${i}"><div class="meta"><div class="name">${o.label}</div><div class="desc">${o.desc}</div></div></button>`).join('')}</div></div></div>`);
    app.querySelectorAll('.choice').forEach((b) => { b.onclick = () => { const o = opts[+b.dataset.i]; if (o.k === 'item') run.items.push('trank'); if (o.k === 'shield') run.items.push('schild'); if (o.k === 'maxhp') { run.hero.maxHp += 10; heal(10); } if (o.k === 'atk') { chooseSlot(o.mod); return; } saveAll(); advance(); }; });
  }
  function chooseSlot(mod) {
    const MODULES = MODULES_OF(); const EXTRA_ATTACKS = CFG().extra;
    render(`<div class="screen">${topbar('🎁 Neue Attacke')}<div class="scroll"><p class="center">Welche Attacke soll ${EXTRA_ATTACKS[mod]} ersetzen?</p><div class="stack">${run.hero.attacks.map((a, i) => `<button class="choice" data-i="${i}"><div class="meta"><div class="name">${esc(a.name)}</div><div class="desc">${MODULES[a.mod].icon} ${MODULES[a.mod].name} · Slot ${i + 1}</div></div></button>`).join('')}<button class="btn ghost" id="skip">Doch lieber behalten</button></div></div></div>`);
    app.querySelectorAll('.choice').forEach((b) => { b.onclick = () => { run.hero.attacks[+b.dataset.i] = { name: EXTRA_ATTACKS[mod], mod }; saveAll(); advance(); }; });
    $('#skip').onclick = () => { run.items.push('trank'); saveAll(); advance(); };
  }

  /* ---------- Zeichenschule ---------- */
  function screenSchool(step) {
    if (step > 6) { render(`<div class="screen">${topbar('✏️ Zeichenschule')}<div class="scroll"><div class="card center"><h2>Merk-Check</h2><p>Jetzt verschwinden die Namen. Weißt du noch, wie alle Teile heißen?</p>${potatoSVG({})}</div></div><div class="bottom"><button class="btn" id="go">Los!</button></div></div>`); $('#go').onclick = () => schoolCheck(MK.shuffle(MK.PARTS.map((p) => p.id)), 0); return; }
    render(`<div class="screen">${topbar(`✏️ Zeichenschule ${step} / 6`)}<div class="scroll"><div class="card"><h3>Schritt ${step}</h3><p>${esc(DRAW_STEPS[step - 1])}</p>${potatoSVG({ step, labels: true })}<p class="muted" style="color:var(--ink-soft)">Zeichne mit auf Papier. Die Namen stehen dabei.</p></div></div><div class="bottom"><div class="row">${step > 1 ? `<button class="btn secondary" id="prev">Zurück</button>` : ''}<button class="btn" id="next">${step < 6 ? 'Nächster Schritt' : 'Zum Merk-Check'}</button></div></div></div>`);
    $('#next').onclick = () => screenSchool(step + 1); if ($('#prev')) $('#prev').onclick = () => screenSchool(step - 1);
  }
  function schoolCheck(ids, i) {
    if (i >= ids.length) { const m = gainXp(20); saveAll(); render(`<div class="screen">${topbar('✏️ Zeichenschule')}<div class="scroll"><div class="card center"><h2>Merk-Check geschafft!</h2><p>⭐ +20 XP</p>${m.map((x) => `<p style="color:var(--orange);font-weight:800">${x}</p>`).join('')}</div></div><div class="bottom"><button class="btn" id="next">Weiter</button></div></div>`); $('#next').onclick = advance; return; }
    const part = MK.PARTS.find((p) => p.id === ids[i]); const others = MK.shuffle(MK.PARTS.filter((p) => p.id !== part.id)).slice(0, 3).map((p) => p.name);
    const t = { kind: 'parts', mod: 'parts', tier: 1, group: 'parts:1', note: 'teile', q: 'Wie heißt der leuchtende Teil?', part: part.id, options: MK.shuffle(others.concat([part.name])), answer: part.name, qid: 'p_' + part.id };
    render(`<div class="screen">${topbar(`✏️ Merk-Check ${i + 1} / ${ids.length}`)}<div class="taskwrap" id="taskwrap"></div><div class="bottom" id="bottom"></div></div>`);
    ensureTutorial(t, () => runTask(t, { container: $('#taskwrap'), bottom: $('#bottom'), subtitle: 'Merk-Check' }, (ok) => { recordAnswer('parts', ok, t); saveAll(); schoolCheck(ids, i + 1); }));
  }

  /* ---------- End screens ---------- */
  function screenGameOver(b) {
    const world = run.world; const name = heroName();
    run = null; saveAll();
    render(`<div class="screen">${topbar('Besiegt…')}<div class="scroll"><div class="card center"><h2>Oh nein!</h2><p>${esc(name)} wurde von ${esc(b.enemy.name)} besiegt.</p><p>Du bist bis Welt ${world} gekommen. Deine Rechenkünste bleiben – beim nächsten Mal klappt es!</p></div></div><div class="bottom"><div class="stack"><button class="btn" id="again">Neues Abenteuer</button><button class="btn ghost" id="home">Zum Titel</button></div></div></div>`);
    $('#again').onclick = screenStarter; $('#home').onclick = screenTitle;
  }
  function screenVictory() {
    meta.wins++; const name = heroName(); const spec = heroSpec(); const evo = run.hero.evo; const bs = CFG().enemies[CFG().worlds].boss; const bossName = bs.acc || bs.name;
    run = null; saveAll();
    render(`<div class="screen">${topbar('Sieg!')}<div class="scroll"><div class="card center"><h1 style="font-size:36px">🎉 Du hast es geschafft!</h1>${monsterSVG(spec.shape, TYPES[spec.type].color, evo)}<p><b>${esc(name)}</b> hat ${esc(bossName)} besiegt${CFG().worlds > 1 ? ` und alle ${CFG().worlds === 3 ? 'drei' : 'zwei'} Welten gemeistert` : ''}!</p><p>Abenteuer geschafft: ${meta.wins}</p></div></div><div class="bottom"><div class="stack"><button class="btn" id="again">Noch ein Abenteuer</button><button class="btn ghost" id="home">Zum Titel</button></div></div></div>`);
    $('#again').onclick = screenStarter; $('#home').onclick = screenTitle;
  }
  function screenDex() {
    const all = []; for (const m of MODE_KEYS) { const EN = MODES[m].enemies; for (const w of Object.keys(EN)) { for (const e of EN[w].normal) all.push(e); all.push(EN[w].elite); all.push(EN[w].boss); } }
    render(`<div class="screen">${topbar('📖 Monsterbuch')}<div class="scroll"><div class="stack">${all.map((e) => { const seen = meta.dex[e.name]; return `<div class="choice" style="cursor:default">${seen ? monsterSVG(e.shape, TYPES[e.type].color, e.boss ? 1 : 0) : `<div class="mon" style="width:96px;height:96px;display:flex;align-items:center;justify-content:center;font-size:48px">❔</div>`}<div class="meta"><div class="name">${seen ? esc(e.name) : '???'}</div>${seen ? typeChip(e.type) : ''}<div class="desc">${seen ? `Welt ${seen.world}${e.boss ? ' · Boss' : ''}` : 'Noch nicht gesehen'}</div></div></div>`; }).join('')}</div></div><div class="bottom"><button class="btn secondary" id="back">Zurück</button></div></div>`);
    $('#back').onclick = screenTitle;
  }
  function screenParent() {
    const tables = MODE_KEYS.map((m) => { const r = load(KEY_RUN_FOR(m), null); const rows = Object.keys(MODES[m].modules).map((k) => { const s = meta.stats[m][k]; const acc = s.t ? Math.round((s.c / s.t) * 100) : 0; return `<tr><td>${MODES[m].modules[k].icon} ${MODES[m].modules[k].name}</td><td>${s.c} / ${s.t}</td><td><div class="bar" aria-label="${acc} %"><i style="width:${acc}%;background:${acc < 50 ? 'var(--red)' : acc < 80 ? 'var(--gold)' : 'var(--green)'}"></i></div></td><td>${acc} %</td><td>${r ? 'Stufe ' + (r.tiers[k] || 1) : '–'}</td></tr>`; }).join(''); return `<div class="card parent-stats" style="margin-bottom:12px"><h3>${MODES[m].icon} ${MODES[m].title}</h3><table><tr><th>Art</th><th>Richtig</th><th></th><th></th><th>Aktuell</th></tr>${rows}</table></div>`; }).join('');
    const weakFacts = Object.entries(meta.know).filter(([id, k]) => k.t >= 2 && k.c / k.t < 0.7).map(([id, k]) => { const q = MK.L_POOL.find((p) => p.id === id) || MK.K_POOL.find((p) => p.id === id.replace('_find', '')); return q ? `<div class="statrow"><span class="n">${esc(q.q)}</span><span>${k.c} / ${k.t}</span></div>` : ''; }).join('');
    render(`<div class="screen">${topbar('👨‍👩‍👦 Elternbereich')}<div class="scroll">${tables}<div class="card parent-stats" style="margin-bottom:12px"><h3>Wissensfragen mit Schwierigkeiten</h3>${weakFacts || '<p class="muted" style="color:var(--ink-soft)">Noch keine – oder noch nicht genug gespielt.</p>'}</div>
      <p class="muted">Die Stufe passt sich an: 5 von 6 richtig → eine Stufe höher, weniger als die Hälfte → eine Stufe tiefer. Welt 1 in Mathe bleibt unter 100. Wissensfragen, die falsch waren, kommen schneller wieder.</p>
      <div class="stack" style="margin-top:14px"><button class="btn secondary" id="rtut">Alle Erklärungen wieder einmalig anzeigen</button><button class="btn secondary" id="rstats">Statistik zurücksetzen</button><button class="btn ghost" id="rall">Alles löschen (Abenteuer, Monsterbuch, Statistik)</button></div></div><div class="bottom"><button class="btn" id="back">Zurück zum Spiel</button></div></div>`);
    $('#back').onclick = screenTitle;
    $('#rtut').onclick = () => { meta.seenTut = {}; saveAll(); screenParent(); };
    $('#rstats').onclick = () => { meta.stats = defaultMeta().stats; meta.know = {}; saveAll(); screenParent(); };
    $('#rall').onclick = () => { meta = defaultMeta(); run = null; for (const m of MODE_KEYS) clear(KEY_RUN_FOR(m)); saveAll(); screenTitle(); };
  }

  screenTitle();
  window.__mq = { get run() { return run; }, get meta() { return meta; }, get mode() { return mode; }, screenMap, screenTitle };
})();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
