/* Baloo 2 (SIL OFL 1.1, see docs/fonts/OFL.txt) – self-hosted: no request to Google, works offline */
@font-face { font-family: 'Baloo 2'; font-style: normal; font-weight: 400 800; font-display: swap; src: url(fonts/baloo2-latin.woff2) format('woff2'); }
:root {
  box-sizing: border-box;

  padding-bottom: env(safe-area-inset-bottom, 0px);

  --blue: #3FA0FF;
  --orange: #FF6A3D;

  --focus: #FFC93C;
  --shadow: 0 6px 0 rgba(0,0,0,.25);
  color-scheme: dark;
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141B33; --bg2: #1C2749; } }
:root[data-theme="dark"] { --bg: #141B33; --bg2: #1C2749; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
body { height: 100%; margin: 0; overscroll-behavior: none; background: var(--bg); color: var(--paper-ink); font-family: 'Baloo 2', 'Nunito', 'Segoe UI Rounded', 'Arial Rounded MT Bold', system-ui, sans-serif; font-size: 20px; line-height: 1.3; -webkit-text-size-adjust: 100%; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }

#app { height: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.scroll { flex: 1; overflow-y: auto; padding: 14px 16px 24px; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--bg2); border-bottom: 3px solid rgba(255,255,255,.08); }
.topbar .title { font-weight: 800; font-size: 20px; flex: 1; }
.topbar .world { font-size: 16px; opacity: .85; }

h1, h2, h3 { margin: 0; line-height: 1.15; }
h1 { font-size: 44px; font-weight: 800; letter-spacing: -.5px; }
h2 { font-size: 28px; font-weight: 800; }
h3 { font-size: 22px; font-weight: 700; }
p { margin: 8px 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 10px 20px; border: 3px solid var(--ink); border-radius: 18px; background: var(--gold); color: var(--ink); font-weight: 800; font-size: 21px; box-shadow: var(--shadow); cursor: pointer; width: 100%; text-align: center; }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.btn.secondary { background: #fff; border: 3px solid var(--ink); box-shadow: 0 6px 0 rgba(28,37,65,.35); }
.card .btn.secondary, .modal .btn.secondary { background: #fff; border: 3px solid var(--ink); }
.card .btn.small, .modal .btn.small { box-shadow: 0 4px 0 rgba(28,37,65,.35); }
.btn.ghost { background: transparent; color: var(--paper-ink); box-shadow: none; border: 3px solid rgba(255,255,255,.6); }
.btn.small { min-height: 44px; font-size: 17px; padding: 6px 14px; width: auto; border-radius: 14px; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* Title */
.hero { text-align: center; padding: 30px 16px 10px; }
.hero .logo { font-size: 72px; line-height: 1; }
.hero .sub { color: var(--gold); font-weight: 700; font-size: 22px; }

/* Cards */
.card { background: var(--card); color: var(--ink); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); }
.card h3 { color: var(--ink); }
.card.flat { box-shadow: none; }
.choice { background: var(--card); color: var(--ink); border: 3px solid var(--ink); border-radius: 22px; padding: 14px; display: flex; gap: 14px; align-items: center; text-align: left; width: 100%; cursor: pointer; box-shadow: var(--shadow); }
.choice:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.choice.selected { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold), var(--shadow); }
.choice .mon { width: 96px; height: 96px; flex: none; }
.choice .meta { flex: 1; }
.choice .meta .name { font-weight: 800; font-size: 24px; }
.choice .meta .desc { font-size: 16px; color: var(--ink-soft); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 15px; font-weight: 700; color: #fff; }

/* Map */
.map { display: flex; flex-direction: column-reverse; gap: 8px; padding: 10px 0; }
.floor { display: flex; justify-content: center; gap: 12px; align-items: center; padding: 6px; border-radius: 18px; }
.floor.current { background: rgba(255,201,60,.14); outline: 3px dashed var(--gold); }
.floor .num { width: 28px; font-size: 14px; opacity: .6; text-align: right; }
.node { width: 78px; height: 78px; border-radius: 50%; border: 3px solid rgba(255,255,255,.5); background: var(--bg2); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 30px; line-height: 1; cursor: default; }
.node small { font-size: 11px; font-weight: 700; margin-top: 2px; }
.floor.current .node { border-color: var(--ink); background: var(--card); color: var(--ink); cursor: pointer; box-shadow: 0 0 0 3px var(--gold), var(--shadow); }
.floor.current .node:active { transform: translateY(3px); }
.floor.done .node { opacity: .35; }
.floor.done .node.taken { opacity: 1; border-color: var(--green); }
.floor.future .node { opacity: .55; }

/* Battle */
.arena { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 6px 14px 2px; }
.fighter { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.fighter .mon { width: 88px; height: 88px; }
.fighter .mon.enemy { transform: scaleX(-1); }
.fighter .name { font-weight: 800; font-size: 19px; display: flex; gap: 6px; align-items: center; }
.hpbar { width: 100%; height: 18px; background: rgba(0,0,0,.35); border-radius: 999px; overflow: hidden; border: 2px solid rgba(255,255,255,.25); }
.hpbar i { display: block; height: 100%; background: var(--green); border-radius: 999px; transition: width .35s; }
.hpbar i.mid { background: var(--gold); } .hpbar i.low { background: var(--red); }
.hptext { font-size: 15px; font-weight: 700; }
.log { min-height: 40px; padding: 4px 16px; text-align: center; font-weight: 700; font-size: 19px; }
.log.hit { color: var(--green); } .log.miss { color: var(--red); } .log.crit { color: var(--gold); }

.bottom { background: var(--bg2); border-top: 3px solid rgba(255,255,255,.08); padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); flex: none; }
.attacks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.atk { background: var(--card); color: var(--ink); border: 3px solid var(--ink); border-radius: 18px; padding: 10px 12px; text-align: left; box-shadow: var(--shadow); cursor: pointer; min-height: 72px; display: flex; flex-direction: column; justify-content: center; }
.atk:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.atk .n { font-weight: 800; font-size: 19px; }
.atk .m { font-size: 14px; color: var(--ink-soft); display: flex; gap: 6px; align-items: center; }
.atk .m .dmg { margin-left: auto; font-weight: 800; color: var(--ink); }
.atk.locked { opacity: .45; }

/* Task */
.taskwrap { flex: 1; overflow-y: auto; min-height: 0; padding: 8px 14px; display: flex; flex-direction: column; }
.task { background: var(--card); color: var(--ink); border-radius: 22px; padding: 14px 16px; box-shadow: var(--shadow); position: relative; }
.task .head { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--ink-soft); font-weight: 700; }
.task .head .tut { margin-left: auto; min-height: 40px; min-width: 40px; border-radius: 999px; border: 3px solid var(--ink); background: #fff; color: var(--ink); font-weight: 800; font-size: 16px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.task .expr { font-size: 40px; font-weight: 800; text-align: center; margin: 10px 0 4px; letter-spacing: 1px; }
.task .clues { font-size: 21px; font-weight: 700; margin: 10px 0; line-height: 1.4; }
.task .clues div::before { content: '• '; color: var(--orange); }
.task .seq { font-size: 34px; font-weight: 800; text-align: center; margin: 10px 0 4px; }
.task .prompt { text-align: center; color: var(--ink-soft); font-weight: 700; font-size: 17px; }
.inputs { display: flex; gap: 10px; justify-content: center; margin: 10px 0 4px; flex-wrap: wrap; align-items: center; }
.inp { min-width: 92px; height: 64px; border-radius: 16px; border: 4px solid var(--ink-soft); background: #fff; font-size: 34px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 12px; color: var(--ink); cursor: pointer; }
.inp.active { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(63,160,255,.3); }
.inp.ok { border-color: var(--green); background: #E6F9EA; } .inp.bad { border-color: var(--red); background: #FFE8E8; }
.inp .lbl { position: absolute; }
.inpgroup { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 15px; font-weight: 700; color: var(--ink-soft); }
.nbline { display: flex; align-items: center; gap: 10px; justify-content: center; }
.nbline .mid { font-size: 40px; font-weight: 800; }
.grid { display: grid; grid-template-columns: repeat(3, 64px); gap: 6px; justify-content: center; margin: 10px 0; }
.grid div { width: 64px; height: 64px; border-radius: 12px; background: var(--card2); border: 3px solid #D9CBAA; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 24px; }
.grid div.start { background: #fff; border-color: var(--ink); }
.grid div.target { background: #FFF1B8; border-color: var(--gold); border-style: dashed; box-shadow: 0 0 0 3px rgba(255,201,60,.5); }
.legend { display: flex; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700; color: var(--ink-soft); flex-wrap: wrap; }
.legend span { background: var(--card2); border-radius: 10px; padding: 2px 8px; }

.numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.numpad button { min-height: 58px; border: 3px solid var(--ink); border-radius: 14px; background: var(--key); color: var(--key-ink); font-size: 28px; font-weight: 800; box-shadow: 0 4px 0 rgba(0,0,0,.3); cursor: pointer; }
.numpad button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
.numpad button.ok { background: var(--green); color: var(--ink); }
.numpad button.del { background: #5A3E6B; font-size: 24px; }
.numpad button.cancel { background: transparent; border: 3px solid rgba(255,255,255,.6); font-size: 18px; }

/* Overlay / modal */
.overlay { position: absolute; inset: 0; background: rgba(10,14,30,.72); display: flex; align-items: flex-end; justify-content: center; z-index: 20; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.modal { background: var(--card); color: var(--ink); border-radius: 24px; padding: 18px; width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; box-shadow: 0 10px 0 rgba(0,0,0,.3); }
.modal h2 { color: var(--ink); margin-bottom: 8px; }
.modal ol { padding-left: 24px; margin: 8px 0 14px; font-size: 19px; }
.modal ol li { margin: 8px 0; }
.modal .ex { background: var(--card2); border-radius: 14px; padding: 10px 12px; font-weight: 700; }

/* Feedback */
.feedback { text-align: center; padding: 10px; border-radius: 18px; font-weight: 800; font-size: 24px; margin-top: 10px; }
.feedback.good { background: #E6F9EA; color: #1C6B2E; }
.feedback.bad { background: #FFE8E8; color: #A42020; }
.feedback small { display: block; font-size: 17px; font-weight: 700; margin-top: 2px; }

.items { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.item { background: var(--card); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; padding: 6px 12px; font-weight: 800; font-size: 16px; display: flex; gap: 6px; align-items: center; box-shadow: var(--shadow); cursor: pointer; min-height: 44px; }

.statrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 2px solid var(--card2); font-size: 17px; }
.statrow .n { flex: 1; font-weight: 700; }
.bar { width: 110px; height: 14px; border-radius: 999px; background: var(--card2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); }

.shake { animation: shake .35s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.pop { animation: pop .45s; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.hurt { animation: hurt .4s; }
@keyframes hurt { 0%,100% { filter: none; } 50% { filter: brightness(2) saturate(0); transform: translateX(-6px); } }
@media (prefers-reduced-motion: reduce) { .shake, .pop, .hurt { animation: none; } .hpbar i { transition: none; } }

.mon { display: block; }
.xpbar { height: 10px; background: rgba(0,0,0,.35); border-radius: 999px; overflow: hidden; width: 100%; }
.xpbar i { display: block; height: 100%; background: var(--blue); }
.center { text-align: center; }
.muted { opacity: .75; font-size: 16px; }
.levelbadge { background: var(--gold); color: var(--ink); border-radius: 999px; padding: 0 8px; font-size: 14px; font-weight: 800; }
.hidden { display: none !important; }
.parent-stats table { width: 100%; border-collapse: collapse; font-size: 15px; }
.parent-stats td, .parent-stats th { padding: 6px 4px; border-bottom: 2px solid var(--card2); text-align: left; }
@media (min-width: 500px) { body { font-size: 21px; } .fighter .mon { width: 140px; height: 140px; } .task .expr { font-size: 48px; } .grid { grid-template-columns: repeat(3, 76px); } .grid div { width: 76px; height: 76px; font-size: 28px; } }

/* Knowledge tasks */
.task .question { font-size: 22px; font-weight: 700; margin: 10px 0 6px; line-height: 1.35; }
.task .question .blank { display: inline-block; border-bottom: 4px solid var(--blue); padding: 0 6px; color: var(--blue); }
.options { display: grid; grid-template-columns: 1fr; gap: 8px; }

@keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }

.atk.tired .tag.tired { animation: none; }

@keyframes fall { 0% { opacity: 0; transform: translateY(0) rotate(0); } 10% { opacity: 1; } 100% { opacity: 0; transform: translateY(85vh) rotate(320deg); } }
@media (prefers-reduced-motion: reduce) {

<body>
<div id="app"></div>
<script>
/* ===== MathQuest Logic (generators, data) ===== */
const MQ = (() => {
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  /* ---------- Modules ---------- */
  const MODULES = {
    add: { name: 'Addition', icon: '➕', maxTier: 5, worldCap: [2, 4, 5], dmg: 10 },
    sub: { name: 'Subtraktion', icon: '➖', maxTier: 5, worldCap: [2, 4, 5], dmg: 12 },
    mul: { name: 'Einmaleins', icon: '✖️', maxTier: 3, worldCap: [2, 3, 3], dmg: 12 },
    riddle: { name: 'Zahlenrätsel', icon: '🔍', maxTier: 3, worldCap: [1, 2, 3], dmg: 16 },
    seq: { name: 'Zahlenfolgen', icon: '🔢', maxTier: 4, worldCap: [2, 3, 4], dmg: 14 },
    nb: { name: 'Nachbarzahlen', icon: '↔️', maxTier: 3, worldCap: [1, 2, 3], dmg: 10 },
    grid: { name: 'Zahlengitter', icon: '🧩', maxTier: 3, worldCap: [1, 2, 3], dmg: 16 },
  };
  const MODULE_KEYS = Object.keys(MODULES);

  /* ---------- Generators ---------- */
  function genAdd(t) {
    let a, b, c;
    if (t === 1) { do { a = rnd(10, 89); b = rnd(3, 89 - a + 10); } while (a + b > 99 || (a % 10) + (b % 10) > 9); return task(`${a} + ${b} = ?`, [a + b]); }
    if (t === 2) { do { a = rnd(11, 88); b = rnd(2, 99 - a); } while ((a % 10) + (b % 10) < 10 || a + b > 99); return task(`${a} + ${b} = ?`, [a + b]); }
    if (t === 3) { do { a = rnd(100, 899); b = rnd(10, 999 - a); } while ((a % 10) + (b % 10) > 9 || (Math.floor(a / 10) % 10) + (Math.floor(b / 10) % 10) > 9); return task(`${a} + ${b} = ?`, [a + b]); }
    if (t === 4) { do { a = rnd(100, 899); b = rnd(10, 999 - a); } while ((a % 10) + (b % 10) < 10 && (Math.floor(a / 10) % 10) + (Math.floor(b / 10) % 10) < 10); return task(`${a} + ${b} = ?`, [a + b]); }
    do { a = rnd(50, 500); b = rnd(20, 300); c = rnd(5, 199); } while (a + b + c > 999); return task(`${a} + ${b} + ${c} = ?`, [a + b + c]);
  }
  function genSub(t) {
    let a, b;
    // tier 1: no ten-crossing (Einer reichen), b ≥ 2, result ≥ 2
    if (t === 1) { do { a = rnd(5, 19); b = rnd(2, 9); } while (a % 10 < b || a - b < 2); return task(`${a} − ${b} = ?`, [a - b]); }
    if (t === 2) { do { a = rnd(21, 99); b = rnd(2, 9); } while (a % 10 >= b || a % 10 === 0); return task(`${a} − ${b} = ?`, [a - b]); }
    if (t === 3) { do { a = rnd(30, 99); b = rnd(11, a - 1); } while (a % 10 >= b % 10); return task(`${a} − ${b} = ?`, [a - b]); }
    if (t === 4) { do { a = rnd(110, 999); b = rnd(5, 99); } while (a % 100 >= b % 100 && a % 10 >= b % 10); return task(`${a} − ${b} = ?`, [a - b]); }
    do { a = rnd(20, 99); b = rnd(2, 19); } while (a % 10 >= b % 10); return task(`${a} − ? = ${a - b}`, [b], { reverse: true });
  }
  function genMul(t) {
    if (t === 1) { const a = rnd(2, 5), b = rnd(2, 10); return task(`${a} · ${b} = ?`, [a * b]); }
    // tier 2 is still world 1 (results must stay under 100), so 10 · 10 is excluded
    if (t === 2) { let a, b; do { a = rnd(2, 10); b = rnd(2, 10); } while (a * b >= 100); return task(`${a} · ${b} = ?`, [a * b]); }
    const a = rnd(2, 10), b = rnd(2, 10); return task(`? · ${a} = ${a * b}`, [b], { reverse: true });
  }

  function digits(n) { return { h: Math.floor(n / 100) % 10, z: Math.floor(n / 10) % 10, e: n % 10 }; }
  const CLUE_TYPES_2 = [
    (d) => d.z > 0 && d.e % d.z === 0 && d.e / d.z >= 2 ? { text: `Mein Einer ist ${d.e / d.z}-mal so groß wie mein Zehner.`, test: (x) => x.z > 0 && x.e === d.e / d.z * x.z } : null,
    (d) => d.e > d.z ? { text: `Mein Einer ist um ${d.e - d.z} größer als mein Zehner.`, test: (x) => x.e - x.z === d.e - d.z } : null,
    (d) => d.e < d.z ? { text: `Mein Einer ist um ${d.z - d.e} kleiner als mein Zehner.`, test: (x) => x.z - x.e === d.z - d.e } : null,
    (d) => ({ text: `Mein Zehner ist ${d.z}.`, test: (x) => x.z === d.z }),
    (d) => ({ text: `Mein Einer ist ${d.e}.`, test: (x) => x.e === d.e }),
    (d) => ({ text: `Meine Quersumme ist ${d.z + d.e}.`, test: (x) => x.z + x.e === d.z + d.e }),
    (d) => d.e === d.z ? { text: `Mein Einer und mein Zehner sind gleich.`, test: (x) => x.e === x.z } : null,
    (d) => ({ text: d.e % 2 === 0 ? `Ich bin eine gerade Zahl.` : `Ich bin eine ungerade Zahl.`, test: (x) => x.e % 2 === d.e % 2 }),
  ];
  const CLUE_TYPES_3 = [
    (d) => d.z > 0 && d.e % d.z === 0 && d.e / d.z >= 2 ? { text: `Mein Einer ist ${d.e / d.z}-mal so groß wie mein Zehner.`, test: (x) => x.z > 0 && x.e === d.e / d.z * x.z } : null,
    (d) => d.e > d.z ? { text: `Mein Einer ist um ${d.e - d.z} größer als mein Zehner.`, test: (x) => x.e - x.z === d.e - d.z } : null,
    (d) => d.e < d.z ? { text: `Mein Einer ist um ${d.z - d.e} kleiner als mein Zehner.`, test: (x) => x.z - x.e === d.z - d.e } : null,
    (d) => d.h < d.z ? { text: `Mein Hunderter ist um ${d.z - d.h} kleiner als mein Zehner.`, test: (x) => x.z - x.h === d.z - d.h } : null,
    (d) => d.h > d.z ? { text: `Mein Hunderter ist um ${d.h - d.z} größer als mein Zehner.`, test: (x) => x.h - x.z === d.h - d.z } : null,
    (d) => d.h > 0 && d.z % d.h === 0 && d.z / d.h >= 2 ? { text: `Mein Zehner ist ${d.z / d.h}-mal so groß wie mein Hunderter.`, test: (x) => x.h > 0 && x.z === d.z / d.h * x.h } : null,
    (d) => ({ text: `Mein Hunderter ist ${d.h}.`, test: (x) => x.h === d.h }),
    (d) => ({ text: `Mein Zehner ist ${d.z}.`, test: (x) => x.z === d.z }),
    (d) => ({ text: `Mein Einer ist ${d.e}.`, test: (x) => x.e === d.e }),
    (d) => ({ text: `Meine Quersumme ist ${d.h + d.z + d.e}.`, test: (x) => x.h + x.z + x.e === d.h + d.z + d.e }),
    (d) => ({ text: d.e % 2 === 0 ? `Ich bin eine gerade Zahl.` : `Ich bin eine ungerade Zahl.`, test: (x) => x.e % 2 === d.e % 2 }),
  ];
  const isRel = (c) => c.text.includes('-mal') || c.text.includes('größer') || c.text.includes('kleiner');
  function countMatches(clues, lo, hi) {
    let n = 0;
    for (let x = lo; x <= hi; x++) { const dx = digits(x); if (clues.every((c) => c.test(dx))) { n++; if (n > 1) break; } }
    return n;
  }
  function genRiddle(t) {
    const three = t >= 2;
    const lo = three ? 100 : 10, hi = three ? 999 : 99;
    const types = three ? CLUE_TYPES_3 : CLUE_TYPES_2;
    const maxClues = t === 3 ? 4 : 3, minRel = t === 3 ? 2 : 1;
    for (let attempt = 0; attempt < 300; attempt++) {
      const n = rnd(lo, hi); const d = digits(n);
      let clues = types.map((f) => f(d)).filter(Boolean);
      if (t === 1) clues = clues.filter((c) => !c.text.startsWith('Ich bin'));
      clues = shuffle(clues);
      // prefer relation clues first (more interesting)
      let rel = clues.filter(isRel);
      if (t === 1) rel = rel.slice(0, 1);
      const ordered = rel.concat(clues.filter((c) => !isRel(c)));
      let chosen = [];
      for (const c of ordered) { chosen.push(c); if (countMatches(chosen, lo, hi) === 1) break; }
      if (countMatches(chosen, lo, hi) !== 1) continue;
      // drop every clue that is not needed for a unique solution (plain clues first, then relations)
      for (const c of chosen.filter((x) => !isRel(x)).concat(chosen.filter(isRel))) {
        const rest = chosen.filter((x) => x !== c);
        if (countMatches(rest, lo, hi) === 1) chosen = rest;
      }
      if (chosen.length >= 2 && chosen.length <= maxClues && chosen.filter(isRel).length >= minRel) {
        return task(chosen.map((c) => c.text).join('\n'), [n], { riddle: true, digits: three ? 3 : 2 });
      }
    }
    // fallback: a fixed digit plus relations to it (always unique, nothing redundant)
    let n, d; do { n = rnd(lo, hi); d = digits(n); } while (d.e === d.z || (three && d.h === d.z));
    const lines = [`Mein Zehner ist ${d.z}.`, d.e > d.z ? `Mein Einer ist um ${d.e - d.z} größer als mein Zehner.` : `Mein Einer ist um ${d.z - d.e} kleiner als mein Zehner.`];

  function genSeq(t) {
    let start, step, step2 = null;
    if (t === 1) { step = rnd(2, 10); start = rnd(1, 99 - step * 6); }

    const seq = [start];
    for (let i = 1; i < 7; i++) seq.push(seq[i - 1] + (step2 === null ? step : (i % 2 === 1 ? step : step2)));

    { title: 'Die Gärtnerin', text: 'Eine Gärtnerin zeigt dir ihre Kartoffelpflanze und stellt eine Frage zu den Pflanzenteilen.', opts: [{ label: 'Antworten', task: 'any', g: 'teile', win: { item: 'schild' }, lose: { hp: -5 } }, { label: 'Ablehnen', effect: {} }] },
    { title: 'Die Kartoffelküche', text: 'Es duftet nach Kartoffelpuffern! Die Köchin gibt dir einen Kraftkeks, wenn du ihre Frage beantwortest.', opts: [{ label: 'Antworten', task: 'any', win: { item: 'keks' }, lose: { hp: -5 } }, { label: 'Weitergehen', effect: {} }] },
    { title: 'Der Gartenzwerg', text: 'Ein Gartenzwerg hält eine Lupe. „Weißt du etwas über Kartoffeln? Dann leihe ich sie dir.“', opts: [{ label: 'Antworten', task: 'any', win: { item: 'lupe' }, lose: { xp: 5 } }, { label: 'Weitergehen', effect: {} }] },
    { title: 'Der Regen', text: 'Es regnet. Die Pflanzen freuen sich – und du kannst dich ausruhen.', opts: [{ label: 'Ausruhen (+15 LP)', effect: { hp: 15 } }, { label: 'Weiter', effect: {} }] },
    { title: 'Das spanische Schiff', text: 'Ein Schiff aus Peru legt an. Der Kapitän stellt dir eine Frage über die Reise der Kartoffel.', opts: [{ label: 'Antworten', task: 'ltk', g: 'herkunft', win: { item: 'grosstrank' }, lose: { hp: -8 } }, { label: 'Weitergehen', effect: {} }] },
  ];

  /* ---------- Spaced repetition selection ---------- */
  function weightedPick(items, know, seqNow) {
    const w = items.map((it) => { const k = know[it.id]; if (!k) return 4; let x = 1 + k.ws * 3; if (k.t > 0 && k.c / k.t < 0.6) x += 2; if (seqNow - (k.last || 0) < 3) x *= 0.15; return x; });
    let total = w.reduce((a, b) => a + b, 0); let r = Math.random() * total;
    for (let i = 0; i < items.length; i++) { r -= w[i]; if (r <= 0) return items[i]; }
    return items[items.length - 1];
  }
  // opts (optional): { g } = nur Fragen zu diesem Thema (g der Pool-Fragen, z. B. 'herkunft'); gibt es keine, dann alle des Moduls
  function generate(mode, mod, tier, know, seqNow, opts) {
    const pool = mode === 'ethik' ? L_POOL : K_POOL;
    const elite = false;
    if (mod === 'ord') { const idx = shuffle(L_EVENTS_ORDER.map((_, i) => i)).slice(0, 4).sort((a, b) => a - b); const items = idx.map((i) => L_EVENTS_ORDER[i]); return { kind: 'order', mod, tier: 1, group: 'ord:1', note: 'leben', q: 'Tippe die Ereignisse in der richtigen Reihenfolge an.', items, order: items.map((x) => x.id), display: shuffle(items), qid: 'ord_' + idx.join('') }; }
    if (mod === 'grow') { const items = GROW.slice(); return { kind: 'order', mod, tier: 1, group: 'grow:1', note: 'wachstum', q: 'Wie wächst die Kartoffel? Tippe die Schritte der Reihe nach an.', items, order: items.map((x) => x.id), display: shuffle(items), qid: 'grow' }; }
    if (mod === 'maerchen' && Math.random() < 0.25) { const idx = shuffle(STORY.map((_, i) => i)).slice(0, 4).sort((a, b) => a - b); const items = idx.map((i) => STORY[i]); return { kind: 'order', mod, tier: 1, group: 'story:1', note: 'maerchen', q: 'Tippe die Teile des Märchens in der richtigen Reihenfolge an.', items, order: items.map((x) => x.id), display: shuffle(items), qid: 'story_' + idx.join('') }; }
    let cands = pool.filter((p) => p.mod === mod);
    if (opts && opts.g) { const topic = cands.filter((p) => p.g === opts.g); if (topic.length) cands = topic; }
    const e = weightedPick(cands, know, seqNow);
    if (mod === 'parts') {
      const part = PARTS.find((p) => p.id === e.part);
      if (tier >= 2) return { kind: 'parts-find', mod, tier: 2, group: 'parts:2', note: 'teile', q: `Tippe auf: ${part.name}`, part: part.id, answer: part.name, qid: e.id + '_find' };
      const others = shuffle(PARTS.filter((p) => p.id !== part.id)).slice(0, 3).map((p) => p.name);
      const options = shuffle(others.concat([part.name]));
      return { kind: 'parts', mod, tier: 1, group: 'parts:1', note: 'teile', q: e.q, part: part.id, options, answer: part.name, qid: e.id };
    }
    if (mod === 'rf' || e.rf) return { kind: 'choice', mod, tier: 1, group: mod + ':1', note: e.g, q: e.q, options: ['Richtig', 'Falsch'], answer: e.a ? 'Richtig' : 'Falsch', why: e.why || '', qid: e.id, cols: 2 };
    // mc, lt, def, ground
    const correct = e.o[e.a]; const options = shuffle(e.o.slice());
    return { kind: 'choice', mod, tier: 1, group: mod + ':1', note: e.g, q: e.q, options, answer: correct, qid: e.id, cols: options.length === 2 ? 2 : 1 };
  }
  function record(know, qid, ok, seqNow) { const k = know[qid] || (know[qid] = { c: 0, t: 0, ws: 0, last: 0 }); k.t++; if (ok) { k.c++; k.ws = 0; } else k.ws++; k.last = seqNow; }

  const MODES = {
    ethik: { modules: L_MODULES, starters: L_STARTERS, extra: L_EXTRA, enemies: L_ENEMIES, events: L_EVENTS, moves: L_MOVES, tut: L_TUT, notes: L_NOTES, pool: L_POOL, worlds: 1, title: 'Luthers Weg', icon: '⛪', sub: 'Ethik: Martin Luther und die Reformation' },
    kartoffel: { modules: K_MODULES, starters: K_STARTERS, extra: K_EXTRA, enemies: K_ENEMIES, events: K_EVENTS, moves: K_MOVES, tut: K_TUT, notes: K_NOTES, pool: K_POOL, worlds: 2, worldAttacks: K_WORLD_ATTACKS, title: 'Die Kartoffel-Werkstatt', icon: '🥔', sub: 'Sachkunde: Pflanze, Herkunft, Ernte, Käfer, Wörter, Märchen', school: true },
  };
  return { MODES, PARTS, GROW, STORY, L_POOL, K_POOL, L_EVENTS_ORDER, generate, record, shuffle, pick, rnd };
})();

<script>
/* ===== MathQuest App ===== */
(() => {
  const { rnd, pick, shuffle, TYPES, BEATS, ENEMY_MOVES, ITEMS, makeMap } = MQ;
  const MODES = {
    math: { modules: MQ.MODULES, starters: MQ.STARTERS, extra: MQ.EXTRA_ATTACKS, enemies: MQ.ENEMIES, events: MQ.EVENTS, tut: null, worlds: 3, title: 'Zahlenquest', icon: '🧮', sub: 'Mathe: Rechnen und Zahlen' },
    ethik: MK.MODES.ethik,
    kartoffel: MK.MODES.kartoffel,
  };
  const MODE_KEYS = ['math', 'ethik', 'kartoffel'];
  // What can be learned, by school grade and subject. A subject can hold several units (game modes).
  // Add grades/subjects/units here – the title screen builds itself from this list.
  const CURRICULUM = [
    { grade: 3, label: 'Klasse 3', subjects: [
      { subject: 'Mathe', modes: ['math'] },
      { subject: 'Ethik', modes: ['ethik'] },
      { subject: 'Sachkunde', modes: ['kartoffel'] },
    ] },
  ];
  let mode = 'math';
  const CFG = () => MODES[mode];
  const MODULES_OF = () => CFG().modules;
  const MODKEYS = () => Object.keys(CFG().modules);
  const $ = (sel, el) => (el || document).querySelector(sel);
  const app = $('#app');
  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ---------- Storage ---------- */
  const KEY_META = 'mathquest_meta_v2';
  const KEY_RUN_FOR = (m) => (m === 'math' ? 'mathquest_run_v1' : 'mathquest_run_' + m);
  function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* storage unavailable */ } }
  function clear(key) { try { localStorage.removeItem(key); } catch (e) { } }

  const emptyStats = (m) => Object.fromEntries(Object.keys(MODES[m].modules).map((k) => [k, { c: 0, t: 0, hist: [] }]));
  const defaultMeta = () => ({ runs: 0, wins: 0, dex: {}, seenTut: {}, stats: Object.fromEntries(MODE_KEYS.map((m) => [m, emptyStats(m)])), know: {}, knowSeq: 0, evoUnlocked: {}, bestWorld: 0, seenNews: '', grade: 3, off: {}, lastStarter: {}, sound: true });
  const isObj = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
  // Load saved progress defensively: anything missing or of the wrong type falls back to the default,
  // so damaged storage can never stop the game from starting.
  function loadMeta() {
    const m = defaultMeta(); const raw = load(KEY_META, null);
    if (isObj(raw)) for (const k of Object.keys(m)) if (raw[k] != null && typeof raw[k] === typeof m[k] && Array.isArray(raw[k]) === Array.isArray(m[k])) m[k] = raw[k];
    for (const k of ['dex', 'seenTut', 'stats', 'know', 'evoUnlocked', 'off', 'lastStarter']) if (!isObj(m[k])) m[k] = {};
    return m;
  }
  let meta = loadMeta();
  (function migrate() { const old = load('mathquest_meta_v1', null); if (old && !load(KEY_META, null)) { meta.runs = old.runs || 0; meta.wins = old.wins || 0; meta.dex = old.dex || {}; meta.bestWorld = old.bestWorld || 0; for (const k in (old.stats || {})) if (meta.stats.math[k]) meta.stats.math[k] = old.stats[k]; for (const k in (old.seenTut || {})) meta.seenTut['math:' + k] = true; save(KEY_META, meta); } })();
  const okStat = (v) => isObj(v) && Number.isFinite(v.c) && Number.isFinite(v.t) && Array.isArray(v.hist);
  for (const m of MODE_KEYS) { if (!isObj(meta.stats[m])) meta.stats[m] = emptyStats(m); for (const k of Object.keys(MODES[m].modules)) if (!okStat(meta.stats[m][k])) meta.stats[m][k] = { c: 0, t: 0, hist: [] }; }
  if (!Number.isFinite(meta.knowSeq)) meta.knowSeq = 0;
  let run = null;
  const curGrade = () => CURRICULUM.find((g) => g.grade === meta.grade) || CURRICULUM[0];
  const gradeTabs = () => `<div class="grades" role="group" aria-label="Klasse">${CURRICULUM.map((g) => `<button class="gradechip ${g === curGrade() ? 'on' : ''}" data-grade="${g.grade}" aria-pressed="${g === curGrade()}">🎓 ${esc(g.label)}</button>`).join('')}</div>`;
  // task types parents switched off (Elternbereich) – at least two stay on per mode
  const offList = (m) => (isObj(meta.off) && Array.isArray(meta.off[m]) ? meta.off[m] : []);
  const enabledMods = (m) => { const all = Object.keys(MODES[m || mode].modules); const on = all.filter((k) => !offList(m || mode).includes(k)); return on.length >= 2 ? on : all; };
  const practice = (k) => (STATS()[k] ? STATS()[k].t : 0);
  // A saved adventure is only removed when it really ends (endRun) or is replaced by a new one –
  // never as a side effect of saving while no adventure is loaded.
  const saveAll = () => { save(KEY_META, meta); if (run && !run.over) save(KEY_RUN_FOR(run.mode), run); };
  function endRun() { if (run) { run.over = true; clear(KEY_RUN_FOR(run.mode)); } save(KEY_META, meta); }
  // A saved adventure must belong to a known hero and have the fields the game needs.
  function loadRun(m) {
    const r = load(KEY_RUN_FOR(m), null);
    const ok = isObj(r) && isObj(r.hero) && Array.isArray(r.map) && isObj(r.tiers) && Array.isArray(r.items) && Array.isArray(r.path) && Array.isArray(r.hero.attacks)
      && Number.isFinite(r.world) && Number.isFinite(r.floor) && Number.isFinite(r.hero.hp) && MODES[m].starters.some((s) => s.id === r.hero.id) && r.world >= 1 && r.world <= MODES[m].worlds && r.floor >= 1 && r.floor <= r.map.length;
    if (!ok) { if (r) clear(KEY_RUN_FOR(m)); return null; }
    if (isObj(r.node) && !NODE_INFO[r.node.type]) r.node = null;
    r.items = r.items.filter((it) => ITEMS[it]);
    r.mode = m; return r;
  }

  /* ---------- Monster art ---------- */
  const monsterSVG = MONART.monsterSVG; const shade = MONART.shade;

  /* ---------- Helpers ---------- */
  const heroName = () => heroSpec().names[run.hero.evo];
  const heroSpec = () => CFG().starters.find((s) => s.id === run.hero.id);
  const STATS = () => meta.stats[mode];
  const tutKey = (k) => mode + ':' + k;
  const typeChip = (t) => `<span class="chip" style="background:${TYPES[t].color};color:#1C2541">${TYPES[t].icon} ${TYPES[t].name}</span>`;
  const xpNeeded = (lvl) => 20 + lvl * 15;
  const worldCapFor = (mod) => { const M = MODULES_OF()[mod]; return Math.min(M.maxTier || Infinity, M.worldCap[Math.min(run.world, M.worldCap.length) - 1]); };
  function tierFor(mod) { return Math.max(1, Math.min(worldCapFor(mod), run.tiers[mod] || 1)); }
  function recordAnswer(mod, ok, task) {
    const M = MODULES_OF()[mod]; const s = STATS()[mod]; s.t++; if (ok) s.c++; s.hist.push(ok ? 1 : 0); if (s.hist.length > 40) s.hist.shift();
    if (task && task.qid) { meta.knowSeq++; MK.record(meta.know, task.qid, ok, meta.knowSeq); }
    const recent = s.hist.slice(-6); const acc = recent.reduce((a, b) => a + b, 0) / recent.length;
    // adapt the level, but never beyond what the current world uses – otherwise the next world would start at its hardest level
    if (run && recent.length >= 6) { const cur = tierFor(mod); if (acc >= 0.85) { run.tiers[mod] = Math.min(worldCapFor(mod), cur + 1); s.hist = []; } else if (acc < 0.5) { run.tiers[mod] = Math.max(1, cur - 1); s.hist = []; } }
  }
  function weakestModule() { let best = null, bestAcc = 2; for (const k of enabledMods()) { const s = STATS()[k]; const acc = s.t === 0 ? 0.6 : s.c / s.t; if (acc < bestAcc) { bestAcc = acc; best = k; } } return best; }
  function makeTask(mod, tier, opts) {
    run.recent = run.recent || {}; const rec = run.recent[mod] = run.recent[mod] || [];
    let t, sig;
    for (let i = 0; i < 12; i++) {
      if (mode === 'math') { t = MQ.generate(mod, tier, opts); t.kind = 'num'; t.group = mod + ':' + t.tier; sig = t.grid ? JSON.stringify(t.grid) : t.text; }
      else { t = MK.generate(mode, mod, tier, meta.know, meta.knowSeq, opts && opts.g ? { g: opts.g } : undefined); sig = t.qid; }
      if (!rec.includes(sig)) break;
    }
    rec.push(sig); if (rec.length > 8) rec.shift();
    return t;
  }
  // all four attacks are available from the start, so children practise different task types
  // switched-off task types are replaced by enabled ones the hero doesn't have yet
  function heroAttacks() {
    const on = enabledMods(); const used = run.hero.attacks.map((a) => a.mod).filter((k) => on.includes(k)); const spare = on.filter((k) => !used.includes(k)); let i = 0;
    return run.hero.attacks.map((a) => { if (on.includes(a.mod)) return Object.assign({}, a); const k = spare.length ? spare.shift() : on[i++ % on.length]; return { name: CFG().extra[k], mod: k }; });
  }
  function gainXp(n) { run.hero.xp += n; let msgs = []; while (run.hero.xp >= xpNeeded(run.hero.level)) { run.hero.xp -= xpNeeded(run.hero.level); run.hero.level++; run.hero.maxHp += 8; run.hero.hp = Math.min(run.hero.maxHp, run.hero.hp + 8); msgs.push(`Level ${run.hero.level}! Alle Attacken machen mehr Schaden.`); } return msgs; }
  function heal(n) { run.hero.hp = Math.min(run.hero.maxHp, run.hero.hp + n); }

  /* ---------- Rendering primitives ---------- */
  let keyHandler = null; // set while a number task is open: physical keyboard works like the on-screen keypad
  // quiet = re-render of the same screen (no fade-in), e.g. every turn in a battle
  function render(html, quiet) { keyHandler = null; app.innerHTML = html; if (!quiet && app.firstElementChild) app.firstElementChild.classList.add('enter'); }

  /* ---------- Sound: soft synthesized tones (no audio files), off via Elternbereich or 🔊 on the title screen ---------- */
  const SFX = (() => {
    let ctx = null;
    const ac = () => { if (!meta.sound) return null; try { if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); } if (ctx.state === 'suspended') ctx.resume(); return ctx; } catch (e) { return null; } };
    function tone(f, t0, dur, o) {
      o = o || {}; const c = ac(); if (!c) return; const t = c.currentTime + t0; const vol = o.vol || 0.05;
      const osc = c.createOscillator(), g = c.createGain(); osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t); if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(c.destination); osc.start(t); osc.stop(t + dur + 0.03);
    }
    const notes = (seq, step, o) => seq.forEach((f, i) => tone(f, i * step, step * 2, o));
    return {
      tap: () => tone(740, 0, 0.05, { vol: 0.02, to: 600 }),
      right: () => notes([523.25, 659.25, 783.99], 0.075, { type: 'triangle', vol: 0.05 }),
      wrong: () => { tone(330, 0, 0.16, { vol: 0.035, to: 294 }); tone(262, 0.13, 0.22, { vol: 0.035, to: 233 }); },
      hit: () => tone(200, 0, 0.13, { type: 'triangle', vol: 0.07, to: 80 }),
      hurt: () => tone(150, 0, 0.16, { vol: 0.06, to: 70 }),
      block: () => tone(700, 0, 0.12, { type: 'triangle', vol: 0.035, to: 1050 }),
      item: () => notes([1046.5, 1318.5], 0.07, { vol: 0.035 }),
      level: () => notes([523.25, 659.25, 783.99, 1046.5], 0.09, { type: 'triangle', vol: 0.05 }),
      win: () => notes([392, 523.25, 659.25, 783.99, 1046.5], 0.12, { type: 'triangle', vol: 0.05 }),
    };
  })();
  document.addEventListener('click', (e) => { if (e.target.closest && e.target.closest('button')) SFX.tap(); }, true);
  // floating damage number above a fighter
  function fx(sel, text, cls) { const el = $(sel); if (!el) return; const r = el.getBoundingClientRect(); const s = document.createElement('span'); s.className = 'floatnum ' + (cls || ''); s.textContent = text; s.setAttribute('aria-hidden', 'true'); s.style.left = (r.left + r.width / 2) + 'px'; s.style.top = (r.top + Math.min(40, r.height * 0.3)) + 'px'; document.body.appendChild(s); setTimeout(() => s.remove(), 1000); }
  document.addEventListener('keydown', (e) => { if (keyHandler && !e.ctrlKey && !e.metaKey && !e.altKey && !$('.overlay')) keyHandler(e); });
  // one persistent live region, so screen readers reliably announce battle messages
  const live = document.createElement('div'); live.className = 'sr-only'; live.setAttribute('aria-live', 'polite'); live.setAttribute('role', 'status'); document.body.appendChild(live);
  function announce(text) { live.textContent = ''; setTimeout(() => { live.textContent = text; }, 50); }
  function topbar(title, extra) { return `<div class="topbar"><div class="title">${title}</div>${extra || ''}${run ? `<div class="world">${CFG().worlds > 1 ? `Welt ${run.world} · ` : ''}Etage ${run.floor}</div>` : ''}</div>`; }
  function modal(html) {
    const ov = document.createElement('div'); ov.className = 'overlay'; ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
    const behind = [...app.children]; behind.forEach((el) => { el.inert = true; }); app.appendChild(ov);
    const rm = ov.remove.bind(ov); ov.remove = () => { behind.forEach((el) => { el.inert = false; }); rm(); };
    return ov;
  }

  /* ---------- Tutorials ---------- */
  function tutFor(group) { if (mode === 'math') { const [mod, tier] = group.split(':'); return Object.assign({ icon: MQ.MODULES[mod].icon }, MQ.TUT[mod][+tier] || MQ.TUT[mod][1]); } const t = CFG().tut[group]; const M = MODULES_OF()[group.split(':')[0]]; return Object.assign({ icon: M ? M.icon : '📖' }, t); }
  function showTutorial(group, note, onClose, auto) {
    const t = tutFor(group); const n = note && CFG().notes ? CFG().notes[note] : null;
    const ov = modal(`<h2>${t.icon} ${esc(t.title)}</h2><p class="muted" style="opacity:.8">${auto ? 'Das ist neu! So geht es:' : 'So geht es:'}</p><ol>${t.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>${n ? `<div class="ex"><div style="font-size:16px;color:var(--ink-soft)">📄 Aus deinen Notizen: ${esc(n.title)}</div>${n.lines.map((l) => `<div>• ${esc(l)}</div>`).join('')}</div>` : ''}<button class="btn" id="tutok" style="margin-top:12px">Verstanden!</button>`);
    $('#tutok', ov).focus({ preventScroll: true });
    $('#tutok', ov).onclick = () => { ov.remove(); meta.seenTut[tutKey(group)] = true; if (note) meta.seenTut[tutKey('note:' + note)] = true; saveAll(); if (onClose) onClose(); };
  }
  function ensureTutorial(task, then) { const needGroup = !meta.seenTut[tutKey(task.group)]; const needNote = task.note && !meta.seenTut[tutKey('note:' + task.note)]; if (needGroup || needNote) showTutorial(task.group, task.note, then, true); else then(); }

  /* ---------- Task UI ---------- */
  // Renders a task card and numpad; calls done(ok)
  function runTask(task, opts, done) {
    opts = opts || {}; window.__task = task;
    if (task.kind !== 'num') return runChoiceTask(task, opts, done);
    const mod = task.mod; const nAns = task.answers.length; const MODULES = MODULES_OF();
    const values = Array(nAns).fill(''); let active = 0; let locked = false;
    const container = opts.container; const bottom = opts.bottom;
    const labelsFor = () => task.nb ? [`${task.nb} davor`, `${task.nb} danach`] : task.seq ? ['', '', ''] : [''];
    function cardHtml() {
      let body = '';
      if (task.riddle) body = `<div class="clues">${task.text.split('\n').map((c) => `<div>${esc(c)}</div>`).join('')}</div><div class="prompt">Welche Zahl bin ich?</div>`;
      else if (task.seq) body = `<div class="seq">${task.seq.join(', ')}, …</div><div class="prompt">Wie gehen die nächsten drei weiter?</div>`;
      else if (task.nb) body = `<div class="prompt">Welche ${task.nb}zahl kommt davor, welche danach?</div>`;
      else if (task.grid) { const g = task.grid; let cells = ''; for (let r = 0; r < g.size; r++) for (let c = 0; c < g.size; c++) { const isS = r === g.sr && c === g.sc, isT = r === g.tr && c === g.tc; cells += `<div class="${isS ? 'start' : ''}${isT ? ' target' : ''}">${isS ? g.base : isT ? '?' : ''}</div>`; } body = `<div class="grid">${cells}</div><div class="legend"><span>⬇ +${g.stepD}</span><span>⬆ −${g.stepD}</span><span>➡ +${g.stepR}</span><span>⬅ −${g.stepR}</span></div><div class="prompt">Welche Zahl steht im Zielfeld?</div>`; }
      else body = `<div class="expr">${esc(task.text)}</div>`;
      let inputs = '';
      if (task.nb) inputs = `<div class="nbline"><div class="inpgroup"><div class="inp" data-i="0"></div><span>davor</span></div><div class="mid">${task.n}</div><div class="inpgroup"><div class="inp" data-i="1"></div><span>danach</span></div></div>`;
      else inputs = `<div class="inputs">${task.answers.map((_, i) => `<div class="inp" data-i="${i}"></div>`).join('')}</div>`;
      const a0 = task.answers[0]; const lo = Math.max(0, a0 - 1 - Math.floor(Math.random() * 3)); const hint = opts.hint ? `<div class="hintline">🔎 Tipp: ${task.answers.length > 1 ? 'Die erste Zahl' : 'Die Antwort'} liegt zwischen ${lo} und ${lo + 4}.</div>` : '';
      return `<div class="task"><div class="head">${MODULES[mod].icon} ${MODULES[mod].name}${opts.subtitle ? ` · ${esc(opts.subtitle)}` : ''}<button class="tut" type="button" aria-label="Erklärung anzeigen">🛈 Wie geht das?</button></div>${body}${hint}${inputs}<div id="fb" role="status" aria-live="polite"></div></div>`;
    }
    container.innerHTML = cardHtml();
    bottom.innerHTML = `<div class="numpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((d) => `<button data-k="${d}">${d}</button>`).join('')}<button class="del" data-k="del" aria-label="Löschen">⌫</button><button data-k="0">0</button><button class="ok" data-k="ok" aria-label="Antwort prüfen">✓</button>${opts.cancel ? `<button class="cancel" data-k="cancel" style="grid-column:1/-1">Abbrechen</button>` : ''}</div>`;
    const inps = Array.from(container.querySelectorAll('.inp'));
    function paint() { inps.forEach((el, i) => { el.textContent = values[i]; el.classList.toggle('active', i === active && !locked); }); const a = inps[active]; if (a && a.scrollIntoView && !locked) a.scrollIntoView({ block: 'nearest' }); }
    inps.forEach((el) => { el.onclick = () => { if (!locked) { active = +el.dataset.i; paint(); } }; });
    $('.tut', container).onclick = () => showTutorial(task.group, task.note);
    paint();
    bottom.onclick = (e) => {
      const b = e.target.closest('button'); if (!b || locked || !bottom.contains(b) || !b.dataset.k) return; press(b.dataset.k);
    };
    keyHandler = (e) => {
      if (locked) return; let k = null;
      if (/^[0-9]$/.test(e.key)) k = e.key; else if (e.key === 'Backspace' || e.key === 'Delete') k = 'del'; else if (e.key === 'Enter') k = 'ok';
      else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && nAns > 1) { e.preventDefault(); active = (active + (e.key === 'ArrowLeft' ? nAns - 1 : 1)) % nAns; paint(); return; }
      if (!k) return; e.preventDefault(); press(k);
    };
    function press(k) {
      if (k === 'cancel') { done(null); return; }
      if (k === 'del') { values[active] = values[active].slice(0, -1); }
      else if (k === 'ok') {
        if (values.some((v) => v === '')) { const idx = values.findIndex((v) => v === ''); if (idx === active) return; active = idx; paint(); return; }
        submit(); return;
      }
      else { if (values[active].length < 3) values[active] += k; }
      paint();
    }
    function submit() {
      locked = true; keyHandler = null;
      const ok = values.every((v, i) => parseInt(v, 10) === task.answers[i]);
      if (opts.onResult) opts.onResult(ok); // game state changes now, so a reload can't undo the answer
      inps.forEach((el, i) => { el.classList.remove('active'); el.classList.add(parseInt(values[i], 10) === task.answers[i] ? 'ok' : 'bad'); });
      const fb = $('#fb', container);
      if (ok) { fb.innerHTML = `<div class="feedback good pop">Richtig! ✔</div>`; SFX.right(); }
      else { SFX.wrong(); const corr = task.answers.join(task.nb ? ' und ' : ', '); fb.innerHTML = `<div class="feedback bad ${reducedMotion ? '' : 'shake'}">Daneben<small>Richtig wäre: ${corr}</small></div>`; }
      if (fb.scrollIntoView) fb.scrollIntoView({ block: 'nearest' });
      bottom.innerHTML = `<button class="btn" id="next">Weiter</button>`;
      $('#next').focus();
      $('#next').onclick = () => done(ok);
    }
  }

  /* ---------- Choice / order / parts tasks ---------- */
  function runChoiceTask(task, opts, done) {
    const container = opts.container, bottom = opts.bottom; const M = MODULES_OF()[task.mod]; let locked = false;
    const head = `<div class="head">${M.icon} ${M.name}${opts.subtitle ? ` · ${esc(opts.subtitle)}` : ''}<button class="tut" type="button" aria-label="Erklärung anzeigen">🛈 Wie geht das?</button></div>`;
    // magnifier item: with two options (e.g. richtig/falsch) crossing one out would give the answer away – show the notes instead
    const strikeWrongOption = () => { if (task.options.length <= 2) { const n = task.note && CFG().notes ? CFG().notes[task.note] : null; $('#fb', container).insertAdjacentHTML('beforebegin', n ? `<div class="hintline">🔎 Tipp aus deinen Notizen „${esc(n.title)}“:<br>${n.lines.map((l) => esc(l)).join('<br>')}</div>` : '<div class="hintline">🔎 Tipp: Lies die Frage noch einmal ganz genau.</div>'); return; } const wrong = [...bottom.querySelectorAll('.opt')].filter((b) => task.options[+b.dataset.i] !== task.answer); const w = wrong[Math.floor(Math.random() * wrong.length)]; if (w) { w.disabled = true; w.classList.add('struck'); } $('#fb', container).insertAdjacentHTML('beforebegin', '<div class="hintline">🔎 Tipp: Eine falsche Antwort ist durchgestrichen.</div>'); };
    const finish = (ok, extraHtml) => {
      locked = true; const fb = $('#fb', container); if (ok) SFX.right(); else SFX.wrong();
      if (opts.onResult) opts.onResult(ok);
      fb.innerHTML = ok ? `<div class="feedback good pop">Richtig! ✔</div>` : `<div class="feedback bad ${reducedMotion ? '' : 'shake'}">Daneben<small>${extraHtml}</small></div>`;
      if (fb.scrollIntoView) fb.scrollIntoView({ block: 'nearest' });
      bottom.innerHTML = `<button class="btn" id="next">Weiter</button>`; $('#next').focus(); $('#next').onclick = () => done(ok);
    };
    if (task.kind === 'choice') {
      container.innerHTML = `<div class="task">${head}<div class="question">${esc(task.q).replace('___', '<span class="blank">____</span>')}</div><div id="fb" role="status" aria-live="polite"></div></div>`;
      bottom.innerHTML = `<div class="options ${task.cols === 2 ? 'two' : ''}">${task.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
      bottom.querySelectorAll('.opt').forEach((b) => { b.onclick = () => { if (locked) return; const ok = task.options[+b.dataset.i] === task.answer; b.classList.add(ok ? 'right' : 'wrong'); finish(ok, `Richtig wäre: ${esc(task.answer)}${task.why ? ' – ' + esc(task.why) : ''}`); }; });
      if (opts.hint) strikeWrongOption();
    } else if (task.kind === 'parts') {
      container.innerHTML = `<div class="task">${head}<div class="question">${esc(task.q)}</div>${potatoSVG({ highlight: task.part })}<div id="fb" role="status" aria-live="polite"></div></div>`;
      bottom.innerHTML = `<div class="options two">${task.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
      bottom.querySelectorAll('.opt').forEach((b) => { b.onclick = () => { if (locked) return; const ok = task.options[+b.dataset.i] === task.answer; b.classList.add(ok ? 'right' : 'wrong'); if (!ok) { const el = container.querySelector('[data-part="' + task.part + '"]'); if (el) el.classList.add('reveal'); } finish(ok, `Das ist: ${esc(task.answer)}`); }; });
      if (opts.hint) strikeWrongOption();
    } else if (task.kind === 'parts-find') {
      container.innerHTML = `<div class="task">${head}<div class="question">${esc(task.q)}</div>${potatoSVG({ clickable: true })}<div id="fb" role="status" aria-live="polite"></div></div>`;
      const pp = MK.PARTS.find((p) => p.id === task.part);
      bottom.innerHTML = `<p class="center muted" style="margin:6px 0">Tippe auf den Teil in der Pflanze.</p>${opts.hint && pp ? `<p class="center hintline">🔎 Tipp: Der Teil ist ${pp.ground === 'unten' ? 'unter' : 'über'} der Erde.</p>` : ''}`;
      container.querySelectorAll('[data-part]').forEach((g) => { g.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); g.onclick(); } }; g.onclick = () => { if (locked) return; const ok = g.dataset.part === task.part; g.classList.add(ok ? 'hit-part' : 'miss-part'); if (!ok) { const el = container.querySelector('[data-part="' + task.part + '"]'); if (el) el.classList.add('reveal'); } finish(ok, `Hier leuchtet jetzt: ${esc(task.answer)}`); }; });
    } else if (task.kind === 'order') {
      const chosen = opts.hint ? [task.order[0]] : []; const fixed = chosen.length;
      container.innerHTML = `<div class="task">${head}<div class="question">${esc(task.q)}</div><div class="orderlist" id="olist"></div><p class="ohelp">Tippe der Reihe nach. Nochmal tippen nimmt es wieder heraus.</p><div id="fb" role="status" aria-live="polite"></div></div>`;
      const paint = () => { $('#olist', container).innerHTML = task.display.map((it) => { const pos = chosen.indexOf(it.id); return `<button class="oitem ${pos >= 0 ? 'picked' : ''}" data-id="${it.id}" aria-pressed="${pos >= 0}" aria-label="${esc(it.text)}${pos >= 0 ? ', Platz ' + (pos + 1) : ''}"><span class="num">${pos >= 0 ? pos + 1 : ''}</span><span>${esc(it.text)}</span></button>`; }).join(''); container.querySelectorAll('.oitem').forEach((b) => { b.onclick = () => { if (locked) return; const pos = chosen.indexOf(b.dataset.id); if (pos >= fixed) chosen.splice(pos, 1); else if (pos < 0) chosen.push(b.dataset.id); paint(); }; }); /* tap again = take it out, the ones after it move up */ $('#ocheck').disabled = chosen.length !== task.order.length; $('#oundo').disabled = chosen.length <= fixed; };
      bottom.innerHTML = `<div class="row"><button class="btn secondary" id="oundo">↶ Rückgängig</button><button class="btn" id="ocheck">✓ Prüfen</button></div>`;
      $('#oundo').onclick = () => { if (!locked && chosen.length > fixed) { chosen.pop(); paint(); } };
      if (fixed) $('#olist', container).insertAdjacentHTML('afterend', '<div class="hintline">🔎 Tipp: Das Erste steht schon richtig.</div>');
      $('#ocheck').onclick = () => { if (locked || chosen.length !== task.order.length) return; const ok = chosen.every((id, i) => id === task.order[i]); const byId = Object.fromEntries(task.items.map((x) => [x.id, x.text])); container.querySelectorAll('.oitem').forEach((b) => { const i = chosen.indexOf(b.dataset.id); b.classList.add(task.order[i] === b.dataset.id ? 'right' : 'wrong'); }); finish(ok, 'Richtige Reihenfolge:<br>' + task.order.map((id, i) => `${i + 1}. ${esc(byId[id])}`).join('<br>')); };
      paint();
    }
    $('.tut', container).onclick = () => showTutorial(task.group, task.note);
  }

  /* ---------- Potato plant drawing ---------- */

    const label = (id, x, y, anchor) => opts.labels && step >= PART_STEP[id] ? `<text class="plabel" x="${x}" y="${y}" text-anchor="${anchor || 'start'}">${MK.PARTS.find((p) => p.id === id).name.replace(' (Frucht)', '')}</text>` : '';

      <rect x="0" y="150" width="260" height="150" fill="#8B5E3C" opacity=".35"/><line x1="0" y1="150" x2="260" y2="150" stroke="#6B4423" stroke-width="3" stroke-dasharray="6 4"/>

      ${label('bluete', 168, 30)}${label('beere', 6, 76)}${label('blaetter', 4, 112)}${label('staengel', 140, 146)}${label('mutterknolle', 162, 178)}${label('wurzeln', 160, 290)}${label('auslaeufer', 6, 204)}${label('tochterknollen', 6, 276)}
    </svg>`;
  }
  const PART_STEP = { mutterknolle: 1, wurzeln: 2, auslaeufer: 3, tochterknollen: 3, staengel: 4, blaetter: 5, bluete: 6, beere: 6 };
  const DRAW_STEPS = ['Zeichne die Erdlinie und darunter die Mutterknolle.', 'Zeichne die Wurzeln nach unten.', 'Zeichne die Ausläufer zur Seite und daran die Tochterknollen.', 'Zeichne den Stängel nach oben mit Seitentrieben.', 'Zeichne die Blätter an die Triebe.', 'Zeichne oben die Blüten und eine kleine Beere.'];

  /* ---------- Screens ---------- */
  function screenTitle() {
    render(`<div class="screen"><div class="scroll"><button class="soundbtn" id="snd" aria-label="${meta.sound ? 'Töne ausschalten' : 'Töne einschalten'}" aria-pressed="${!!meta.sound}">${meta.sound ? '🔊' : '🔇'}</button><div class="hero"><div class="logo">🎒</div><h1 id="logo">Lern­quest</h1><div class="sub">Monster · Wissen · Abenteuer</div></div>
      <div class="stack" style="margin-top:16px">
        ${gradeTabs()}${(curGrade().subjects).map((sub) => sub.modes.map((m) => { const r = loadRun(m); const c = MODES[m]; return `<div class="card modecard"><div class="eyebrow">${esc(sub.subject)}</div><div class="row" style="align-items:center;gap:12px"><div style="font-size:40px" aria-hidden="true">${c.icon}</div><div style="flex:1"><h3>${c.title}</h3><div class="desc">${c.sub}</div></div></div><div class="row" style="margin-top:10px">${r ? `<button class="btn small" data-cont="${m}">Weiter (${c.worlds > 1 ? 'Welt ' + r.world + ', ' : ''}Etage ${r.floor})</button>` : ''}<button class="btn small ${r ? 'secondary' : ''}" data-new="${m}">${r ? 'Neu' : 'Starten'}</button></div></div>`; }).join('')).join('')}
        <button class="btn ghost" id="dex">Monsterbuch (${Object.keys(meta.dex).length})</button>
        <div class="row"><button class="btn ghost" id="news">📰 Was ist neu?${hasNews() ? ' <span class="newbadge">Neu!</span>' : ''}</button><button class="btn ghost" id="feedback">💡 Idee senden</button></div>
        <p class="center muted">Abenteuer gespielt: ${meta.runs} · Geschafft: ${meta.wins}</p>
      </div></div></div>`);
    let taps = 0; $('#logo').onclick = () => { taps++; if (taps >= 5) { taps = 0; screenParent(); } };
    app.querySelectorAll('[data-cont]').forEach((b) => { b.onclick = () => { mode = b.dataset.cont; run = loadRun(mode); if (run) resumeRun(); else screenTitle(); }; });
    app.querySelectorAll('[data-new]').forEach((b) => { b.onclick = () => { mode = b.dataset.new; const r = loadRun(mode); if (r) { const ov = modal(`<h2>Neues Abenteuer?</h2><p>Dein laufendes Abenteuer in „${MODES[mode].title}“ wird gelöscht.</p><div class="stack"><button class="btn" id="yes">Ja, neu starten</button><button class="btn secondary" id="no">Zurück</button></div>`); $('#yes', ov).onclick = () => { run = null; screenStarter(); /* old save is replaced only when the new adventure starts */ }; $('#no', ov).onclick = () => ov.remove(); } else screenStarter(); }; });
    $('#dex').onclick = screenDex;
    $('#news').onclick = screenNews;
    $('#feedback').onclick = () => screenFeedback(screenTitle);
    $('#snd').onclick = () => { meta.sound = !meta.sound; saveAll(); screenTitle(); };
    app.querySelectorAll('[data-grade]').forEach((b) => { b.onclick = () => { meta.grade = +b.dataset.grade; saveAll(); screenTitle(); }; });
  }

  /* ---------- Changelog ("Was ist neu?") – data comes from CHANGELOG.md via build.py ---------- */
  const NEWS = (typeof CHANGELOG !== 'undefined' && Array.isArray(CHANGELOG)) ? CHANGELOG : [];
  const hasNews = () => NEWS.length > 0 && NEWS[0].date > (meta.seenNews || '');
  const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  const deDate = (iso) => { const [y, m, d] = iso.split('-').map(Number); return `${d}. ${MONTHS[m - 1]} ${y}`; };
  const GROUP_ICON = { 'Neu': '✨', 'Verbessert': '🔧', 'Behoben': '🐞' };
  function screenNews() {
    const unseen = meta.seenNews || '';
    render(`<div class="screen">${topbar('📰 Was ist neu?')}<div class="scroll"><div class="stack">${NEWS.map((e) => `<div class="card news"><h3>${deDate(e.date)}${e.date > unseen ? ' <span class="newbadge">Neu!</span>' : ''}</h3>${e.groups.map((g) => `<h4>${GROUP_ICON[g.title] || '📌'} ${esc(g.title)}</h4><ul>${g.items.map((it) => `<li>${esc(it)}</li>`).join('')}</ul>`).join('')}</div>`).join('') || '<p>Noch keine Einträge.</p>'}</div></div><div class="bottom"><button class="btn secondary" id="back">Zurück</button></div></div>`);
    if (NEWS.length) { meta.seenNews = NEWS[0].date; saveAll(); }
    $('#back').onclick = screenTitle;
  }

  function screenStarter() {
    let sel = CFG().starters.length === 1 ? CFG().starters[0].id : null;
    // recommend the monster whose attacks were practised least (and not the one played last time)
    const S = CFG().starters; const last = meta.lastStarter[mode];
    const score = (s) => s.attacks.reduce((n, a) => n + practice(a.mod), 0) + (s.id === last ? 1e6 : 0);
    const rec = S.length > 1 ? S.slice().sort((a, b) => score(a) - score(b))[0].id : null;
    // offer to swap the most practised attack for a task type that was hardly practised yet
    let swap = null, swapOn = true;
    const swapFor = (s) => { if (!s) return null; const have = s.attacks.map((a) => a.mod); const cand = enabledMods().filter((k) => !have.includes(k)).sort((a, b) => practice(a) - practice(b))[0]; const most = have.filter((k) => enabledMods().includes(k)).sort((a, b) => practice(b) - practice(a))[0];
      return cand && most && practice(most) >= practice(cand) + 3 ? { from: most, to: cand } : null; };
    const paintSwap = () => { const s = S.find((x) => x.id === sel); swap = swapFor(s); const box = $('#swapbox'); if (!box) return; const M = MODULES_OF();
      box.innerHTML = swap ? `<button class="choice swap ${swapOn ? 'selected' : ''}" id="swap" aria-pressed="${swapOn}"><div class="meta"><div class="name">🎯 Neues üben: ${M[swap.to].icon} ${M[swap.to].name}</div><div class="desc">Statt ${M[swap.from].name} (schon oft geübt) bekommst du die Attacke „${esc(CFG().extra[swap.to])}“. ✨ Bonus: Sternenstaub!</div></div><span class="tick" aria-hidden="true">${swapOn ? '✔' : ''}</span></button>` : '';
      if (swap) $('#swap').onclick = () => { swapOn = !swapOn; paintSwap(); }; };
    render(`<div class="screen">${topbar(CFG().starters.length === 1 ? 'Dein Held' : 'Wähle dein Monster')}<div class="scroll"><div class="stack">
      ${CFG().starters.map((s) => `<button class="choice ${CFG().starters.length === 1 ? 'selected' : ''}" data-id="${s.id}">${monsterSVG(s.shape, TYPES[s.type].color, 0)}<div class="meta">${rec === s.id ? '<div class="recbadge">⭐ Empfohlen: übt Neues · ✨ Bonus</div>' : ''}<div class="name">${s.names[0]}</div>${typeChip(s.type)}<div class="desc">${s.desc}<br>❤️ ${s.hp} LP · Attacken: ${[...new Set(s.attacks.map((a) => MODULES_OF()[a.mod].name))].join(', ')}</div></div></button>`).join('')}
      <div id="swapbox"></div>
      </div></div><div class="bottom"><div class="row"><button class="btn secondary" id="back">Zurück</button><button class="btn" id="go" ${sel ? '' : 'disabled'}>Los geht’s!</button></div></div></div>`);
    $('#back').onclick = screenTitle;
    app.querySelectorAll('.choice[data-id]').forEach((b) => { b.onclick = () => { sel = b.dataset.id; app.querySelectorAll('.choice[data-id]').forEach((x) => x.classList.toggle('selected', x === b)); $('#go').disabled = false; paintSwap(); }; });
    paintSwap();
    $('#go').onclick = () => { if (!sel) return; const s = CFG().starters.find((x) => x.id === sel); run = { mode, world: 1, floor: 1, map: makeMapFor(1), hero: { id: s.id, evo: 0, level: 1, xp: 0, hp: s.hp, maxHp: s.hp, attacks: s.attacks.map((a) => ({ name: a.name, mod: a.mod })) }, items: ['trank'], tiers: Object.fromEntries(MODKEYS().map((k) => [k, 1])), path: [], shield: false };
      if (swap && swapOn) { const a = run.hero.attacks.find((x) => x.mod === swap.from); if (a) { a.mod = swap.to; a.name = CFG().extra[swap.to]; } }
      if (rec && sel === rec) run.items.push('stern');
      if (swap && swapOn) run.items.push('stern');
      meta.lastStarter[mode] = sel; meta.runs++; saveAll(); screenMap(); };
  }
  function makeMapFor(world) { const m = makeMap(world); if (CFG().school && world === 1) { m[1] = ['school']; if (!m[4].includes('school')) m[4][0] = 'school'; } return m;
  }

  const NODE_INFO = { fight: ['⚔️', 'Kampf'], elite: ['💀', 'Elite'], event: ['❓', 'Ereignis'], rest: ['🔥', 'Rast'], treasure: ['🎁', 'Schatz'], boss: ['👑', 'Boss'], school: ['✏️', 'Zeichenschule'] };
  function screenMap() {
    const h = run.hero;
    const rows = run.map.map((nodes, fi) => { const f = fi + 1; const cls = f === run.floor ? 'current' : f < run.floor ? 'done' : 'future'; return `<div class="floor ${cls}"><div class="num">${f}</div>${nodes.map((n, ni) => `<button class="node ${run.path[fi] === ni ? 'taken' : ''}" data-f="${f}" data-n="${ni}" ${f !== run.floor ? 'tabindex="-1" disabled' : ''} aria-label="${NODE_INFO[n][1]}">${NODE_INFO[n][0]}<small>${NODE_INFO[n][1]}</small></button>`).join('')}</div>`; });
    render(`<div class="screen">${topbar(`${esc(heroName())} <span class="levelbadge">Lv ${h.level}</span>`)}
      <div style="padding:8px 16px 0"><div class="hpbar"><i style="width:${(h.hp / h.maxHp) * 100}%" class="${h.hp / h.maxHp < .3 ? 'low' : h.hp / h.maxHp < .6 ? 'mid' : ''}"></i></div><div class="row" style="justify-content:space-between;font-size:15px;font-weight:700"><span>❤️ ${h.hp} / ${h.maxHp}</span><span>⭐ ${h.xp} / ${xpNeeded(h.level)} XP</span></div></div>
      <div class="scroll"><p class="center muted">Wohin gehst du? Tippe auf ein Feld.</p><div class="map">${rows.join('')}</div></div>
      <div class="bottom"><div class="row"><button class="btn secondary small" id="bag">🎒 Beutel (${run.items.length})</button><button class="btn ghost small" id="home">Titel</button></div></div></div>`);
    app.querySelectorAll('.floor.current .node').forEach((b) => { b.onclick = () => { const ni = +b.dataset.n; run.path[run.floor - 1] = ni; const type = run.map[run.floor - 1][ni]; run.node = { type }; saveAll(); enterNode(type); }; });
    $('#home').onclick = screenTitle;
    $('#bag').onclick = () => showBag(null);
    const scroller = $('.scroll'); const cur = $('.floor.current'); if (cur && scroller) scroller.scrollTop = Math.max(0, cur.offsetTop - scroller.clientHeight / 2);
  }
  function showBag(inBattle) {
    const ov = modal(`<h2>🎒 Beutel</h2>${run.items.length ? `<div class="items">${run.items.map((it, i) => `<button class="item" data-i="${i}"><span>${ITEMS[it].icon} ${ITEMS[it].name}</span><small>${esc(ITEMS[it].desc)}</small></button>`).join('')}</div><p class="muted" style="opacity:.8;margin-top:10px" id="bagdesc">Tippe auf einen Gegenstand, um ihn zu benutzen.</p>` : '<p>Dein Beutel ist leer.</p>'}<button class="btn secondary" id="close" style="margin-top:10px">Schließen</button>`);
    $('#close', ov).onclick = () => ov.remove();
    ov.querySelectorAll('.item').forEach((b) => { b.onclick = () => { const it = ITEMS[run.items[+b.dataset.i]]; if (it.heal && run.hero.hp >= run.hero.maxHp) { $('#bagdesc', ov).textContent = 'Du hast schon volle Lebenspunkte.'; return; } if ((it.shield || it.power || it.hint) && !inBattle) { $('#bagdesc', ov).textContent = `${it.name}: Das kannst du nur im Kampf benutzen.`; return; } if (it.revive) { $('#bagdesc', ov).textContent = `${it.name}: ${it.desc}`; return; } if ((it.shield && run.shield) || (it.power && run.power) || (it.hint && run.hint)) { $('#bagdesc', ov).textContent = `${it.name} ist schon aktiv. Heb dir den nächsten auf!`; return; } run.items.splice(+b.dataset.i, 1); if (it.heal) heal(it.heal); if (it.shield) run.shield = true; if (it.power) run.power = true; if (it.hint) run.hint = true; const lv = it.xp ? gainXp(it.xp) : []; if (lv.length) setTimeout(SFX.level, 150); else SFX.item(); saveAll(); ov.remove(); if (inBattle) inBattle(it, lv); else { screenMap(); if (it.xp) { const m = modal(`<h2>${it.icon} +${it.xp} XP</h2>${lv.map((x) => `<p style="font-weight:800;color:var(--orange)">${esc(x)}</p>`).join('') || '<p>Dein Monster lernt dazu.</p>'}<button class="btn" id="tutok">Super!</button>`); $('#tutok', m).focus({ preventScroll: true }); $('#tutok', m).onclick = () => m.remove(); } } }; });
  }

  // Continue a saved adventure exactly where it stopped: a node that was entered can't be swapped for another
  // one by closing the app, and a running fight continues with the same enemy and life points.
  function resumeRun() {
    const n = run.node;
    if (!isObj(n)) return screenMap();
    if (n.done) return advance();
    if (isObj(n.enemy)) {
      const b = { enemy: n.enemy, log: 'Der Kampf geht weiter!', logCls: '', phase: 'choose' };
      if (n.enemy.hp <= 0) return battleWon(b); // defeated just before the app closed: hand out the reward
      if (n.enemy.pending) { b.phase = 'wait'; renderBattle(b); setTimeout(() => { if (run) enemyTurn(b, n.enemy.pending); }, 600); return; } // the enemy still has its turn
      return renderBattle(b);
    }
    if (n.type === 'event' && Number.isInteger(n.opt)) return screenEvent(n.opt); // a started event task can't be swapped for the safe option
    enterNode(n.type);
  }
  // mark the current node as finished (rewards already given) – a reload then simply moves on
  function nodeDone() { if (run.node) { run.node.done = true; run.node.enemy = null; } }
  function enterNode(type) {
    if (type === 'fight') startBattle(pick(CFG().enemies[run.world].normal), false);
    else if (type === 'elite') startBattle(CFG().enemies[run.world].elite, true);
    else if (type === 'boss') startBattle(CFG().enemies[run.world].boss, true);
    else if (type === 'event') screenEvent();
    else if (type === 'rest') screenRest();
    else if (type === 'treasure') screenTreasure();
    else if (type === 'school') screenSchool(1);
  }
  function advance() { run.floor++; run.shield = false; run.node = null; if (run.floor > 8) { if (run.world >= CFG().worlds) { screenVictory(); return; } run.world++; run.floor = 1; run.map = makeMapFor(run.world); run.path = []; meta.bestWorld = Math.max(meta.bestWorld, run.world); if (CFG().worldAttacks && CFG().worldAttacks[run.world]) { run.hero.attacks = CFG().worldAttacks[run.world].map((x) => ({ name: x.name, mod: x.mod })); } } saveAll(); screenMap(); }

  /* ---------- Battle ---------- */
  function startBattle(spec, hard) {
    const scale = 1 + (run.floor - 1) * 0.03;
    const enemy = { name: spec.name, type: spec.type, shape: spec.shape, maxHp: Math.round(spec.hp * scale), hp: Math.round(spec.hp * scale), atk: Math.round(spec.atk * (1 + (run.floor - 1) * 0.02)), boss: !!spec.boss, elite: hard && !spec.boss };
    meta.dex[spec.name] = { type: spec.type, shape: spec.shape, world: run.world, mode };
    if (run.node) { run.node.enemy = enemy; saveAll(); }
    const b = { enemy, log: `${enemy.name} taucht auf!`, logCls: '', phase: 'choose' };
    renderBattle(b);
  }
  function renderBattle(b) {
    const h = run.hero, e = b.enemy;
    const pct = (a, m) => Math.max(0, (a / m) * 100);
    const hpcls = (a, m) => a / m < .3 ? 'low' : a / m < .6 ? 'mid' : '';
    const quiet = !!b.shown; b.shown = true;
    render(`<div class="screen">${topbar(e.boss ? '👑 Bosskampf' : e.elite ? '💀 Elitekampf' : '⚔️ Kampf')}
      <div class="arena">
        <div class="fighter" id="fh">${monsterSVG(heroSpec().shape, TYPES[heroSpec().type].color, h.evo)}<div class="name">${esc(heroName())} <span class="levelbadge">Lv ${h.level}</span></div><div class="hpbar"><i class="${hpcls(h.hp, h.maxHp)}" style="width:${pct(h.hp, h.maxHp)}%"></i></div><div class="hptext">❤️ ${h.hp} / ${h.maxHp} ${run.shield ? '🛡️' : ''}</div></div>
        <div class="fighter" id="fe">${monsterSVG(e.shape, TYPES[e.type].color, e.boss ? 1 : 0, 'enemy')}<div class="name">${esc(e.name)}</div>${typeChip(e.type)}${BEATS[heroSpec().type] === e.type ? `<div class="advantage">💪 Du bist stark gegen ${TYPES[e.type].name}!</div>` : ''}<div class="hpbar"><i class="${hpcls(e.hp, e.maxHp)}" style="width:${pct(e.hp, e.maxHp)}%"></i></div><div class="hptext">❤️ ${e.hp} / ${e.maxHp}</div></div>
      </div>
      <div class="log ${b.logCls}">${b.log}</div>
      <div class="taskwrap" id="taskwrap"></div>
      <div class="bottom" id="bottom"></div></div>`, quiet);
    announce(b.log.replace(/<[^>]+>/g, ''));
    if (b.phase === 'choose') renderAttackChoice(b);
  }
  // Damage is always shown as a whole number. Using the same attack again in a row makes it "tired"
  // (less damage), so it pays off to switch attacks and practise different things.
  const TIRED = [1, 0.6, 0.35];
  function attackInfo(b, atk) {
    const strong = BEATS[heroSpec().type] === b.enemy.type;
    const tired = b.enemy.lastMod === atk.mod ? Math.min(b.enemy.reps || 1, TIRED.length - 1) : 0;
    let dmg = (MODULES_OF()[atk.mod].dmg + run.hero.level * 2) * (strong ? 1.5 : 1) * TIRED[tired];
    if (run.power) dmg *= 2;
    return { dmg: Math.max(1, Math.round(dmg)), strong, tired };
  }
  function noteAttackUsed(b, atk) { if (b.enemy.lastMod === atk.mod) b.enemy.reps = (b.enemy.reps || 1) + 1; else { b.enemy.lastMod = atk.mod; b.enemy.reps = 1; } }
  function renderAttackChoice(b) {
    const atks = heroAttacks(); const MODULES = MODULES_OF();
    $('#bottom').innerHTML = `<div class="attacks">${atks.map((a, i) => { const inf = attackInfo(b, a); return `<button class="atk ${inf.tired ? 'tired' : ''}" data-i="${i}" aria-label="${esc(a.name)}: ${MODULES[a.mod].name}, ${inf.dmg} Schaden${inf.strong ? ', stark' : ''}${inf.tired ? ', müde' : ''}"><span class="n">${esc(a.name)}</span><span class="m">${MODULES[a.mod].icon} ${MODULES[a.mod].name}<span class="dmg">💥 ${inf.dmg}</span></span><span class="tags">${inf.tired ? `<span class="tag tired">😮‍💨 ${inf.tired > 1 ? 'sehr müde' : 'müde'}</span>` : ''}${run.power ? '<span class="tag power">🍪 doppelt</span>' : ''}</span></button>`; }).join('')}</div><div class="row" style="margin-top:8px"><button class="btn secondary small" id="bag">🎒 Beutel (${run.items.length})</button><span class="muted" style="align-self:center;font-size:14px">Tipp: Abwechseln – sonst wird die Attacke müde.</span></div>`;
    $('#bag').onclick = () => showBag((it, lv) => useItemInBattle(b, it, lv));
    app.querySelectorAll('.atk').forEach((btn) => { btn.onclick = () => chooseAttack(b, atks[+btn.dataset.i]); });
    if (!meta.seenTut['battle:intro']) showBattleIntro();
  }
  function showBattleIntro() {
    const ov = modal(`<h2>⚔️ So kämpfst du</h2><ol><li>Tippe auf eine Attacke und löse die Aufgabe.</li><li>Richtig gelöst: Dein Monster trifft. Die Zahl bei 💥 zeigt, wie viel Schaden das macht.</li><li>💪 <b>Stark gegen …</b> beim Gegner heißt: Dein Monster ist stark gegen ihn – alle Attacken machen mehr Schaden.</li><li>😮‍💨 <b>müde</b> heißt: Du hast die Attacke gerade schon benutzt. Nimm eine andere – dann ist sie wieder stark.</li><li>Falsch gelöst: Der Gegner bekommt einen freien Schlag.</li></ol><button class="btn" id="tutok" style="margin-top:12px">Los geht’s!</button>`);
    $('#tutok', ov).focus({ preventScroll: true });
    $('#tutok', ov).onclick = () => { ov.remove(); meta.seenTut['battle:intro'] = true; saveAll(); };
  }
  // potions take your turn; shield, cookie, magnifier and stars don't
  function useItemInBattle(b, it, lv) {
    b.logCls = 'hit';
    if (it.xp) { b.log = `${it.icon} +${it.xp} XP!${lv && lv.length ? ' ' + lv.join(' ') : ''}`; b.phase = 'choose'; renderBattle(b); return; }
    if (it.shield) { b.log = `${it.icon} Schild bereit! Der nächste Angriff wird geblockt.`; b.phase = 'choose'; renderBattle(b); return; }
    if (it.power) { b.log = `${it.icon} ${it.name}! Dein nächster Treffer macht doppelten Schaden.`; b.phase = 'choose'; renderBattle(b); return; }
    if (it.hint) { b.log = `${it.icon} ${it.name}! Bei der nächsten Aufgabe bekommst du einen Tipp.`; b.phase = 'choose'; renderBattle(b); return; }
    b.log = `${it.icon} ${it.name} benutzt!`; enemyTurn(b, 1);
  }
  function chooseAttack(b, atk) {
    const tier = tierFor(atk.mod);
    let t = makeTask(atk.mod, tier, { elite: b.enemy.elite || b.enemy.boss });
    b.phase = 'task'; $('.screen').classList.add('tasking'); $('#bottom').innerHTML = ''; // no second attack while the task opens
    const hint = !!run.hint; run.hint = false;
    let hit = null;
    // the answer counts the moment it is checked: damage, stats and the enemy's turn are saved right away
    const onResult = (ok) => {
      recordAnswer(atk.mod, ok, t);
      const inf = attackInfo(b, atk);
      if (ok) {
        noteAttackUsed(b, atk); // only hits make an attack tired – after a mistake the child may try the same type again
        let dmg = inf.dmg; const crit = heroSpec().perk === 'crit' && Math.random() < 0.15;
        if (crit) dmg *= 2;
        run.power = false;
        b.enemy.hp = Math.max(0, b.enemy.hp - dmg);
        if (heroSpec().perk === 'heal') heal(3);
        b.log = `${atk.name}: ${crit ? 'VOLLTREFFER – doppelter Schaden! ' : inf.strong ? 'Stark! ' : 'Treffer! '}${dmg} Schaden${inf.tired ? ' (müde)' : ''}`; b.logCls = crit ? 'crit' : 'hit';
        hit = { dmg, crit };
        if (b.enemy.hp > 0) b.enemy.pending = 1;
      } else {
        b.log = `${atk.name} geht daneben… ${b.enemy.name} hat einen freien Schlag!`; b.logCls = 'miss';
        b.enemy.pending = 1.5;
      }
      saveAll();
    };
    ensureTutorial(t, () => {
      runTask(t, { container: $('#taskwrap'), bottom: $('#bottom'), subtitle: atk.name, hint, onResult }, () => {
        b.phase = b.enemy.hp <= 0 ? 'over' : 'wait'; // attacks come back after the enemy's turn
        if (hit) { renderBattle(b, true); $('#fe').classList.add('hurt'); fx('#fe', '−' + hit.dmg, hit.crit ? 'crit' : ''); SFX.hit(); }
        else renderBattle(b, true);
        if (b.enemy.hp <= 0) { setTimeout(() => { if (run) battleWon(b); }, 650); return; }
        setTimeout(() => { if (run) enemyTurn(b, b.enemy.pending || 1); }, hit ? 700 : 900);
      });
    });
  }
  function enemyTurn(b, mult) {
    const h = run.hero; const move = pick(CFG().moves || ENEMY_MOVES);
    b.taken = 0; delete b.enemy.pending;
    if (run.shield) { run.shield = false; b.log = `${b.enemy.name} greift mit ${move} an – dein Schild blockt alles! 🛡️`; b.logCls = 'hit'; }
    else { let dmg = Math.round(b.enemy.atk * mult * (0.85 + Math.random() * 0.3)); if (BEATS[b.enemy.type] === heroSpec().type) dmg = Math.round(dmg * 1.25); if (heroSpec().perk === 'tank') dmg = Math.round(dmg * 0.85); dmg = Math.max(1, dmg); b.taken = dmg; h.hp = Math.max(0, h.hp - dmg); b.log = `${b.enemy.name} greift mit ${move} an: ${dmg} Schaden${mult > 1 ? ' (freier Schlag)' : ''}`; b.logCls = 'miss'; }
    const angel = run.items.indexOf('engel');
    if (h.hp <= 0 && angel >= 0) { run.items.splice(angel, 1); h.hp = Math.round(h.maxHp * 0.5); b.log += ` – aber ${ITEMS.engel.icon} der Schutzengel rettet dich! ❤️ ${h.hp}`; b.logCls = 'crit'; }
    b.phase = h.hp <= 0 ? 'over' : 'choose'; if (h.hp <= 0) endRun(); else saveAll(); renderBattle(b);
    if (b.taken) { $('#fh').classList.add('hurt'); fx('#fh', '−' + b.taken); SFX.hurt(); } else { fx('#fh', '🛡️', 'shield'); SFX.block(); }

      <div class="bottom"><div class="stack"><button class="btn" id="fbsend">📨 Absenden</button><button class="btn ghost" id="back">Zurück</button></div></div></div>`);
    let kind = '💡 Idee'; let sending = false;
    app.querySelectorAll('[data-kind]').forEach((b) => { b.onclick = () => { kind = b.dataset.kind; app.querySelectorAll('[data-kind]').forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); }); }; });
    const text = () => $('#fbtext').value.trim();
    const body = () => `${kind}: ${text()}\n\n(Lernquest, Version ${(document.querySelector('meta[name=app-version]') || {}).content || '?'})`;
    const formLink = () => `${FEEDBACK.form}/viewform?usp=pp_url&${FEEDBACK.entry}=${encodeURIComponent(body())}`;
    $('#back').onclick = () => back();
    $('#fbsend').onclick = async () => {
      if (sending) return;
      if (!text()) { $('#fbtext').focus(); $('#fbmsg').textContent = 'Bitte zuerst etwas hineinschreiben 🙂'; return; }
      sending = true; $('#fbsend').disabled = true; $('#fbsend').textContent = '📨 Wird gesendet …';
      try {
        if (navigator.onLine === false) throw new Error('offline');
        // Google Forms doesn't allow reading the answer (no-cors), but a request that goes out arrives.
        await fetch(`${FEEDBACK.form}/formResponse`, { method: 'POST', mode: 'no-cors', body: new URLSearchParams({ [FEEDBACK.entry]: body() }) });
        SFX.item();
        render(`<div class="screen">${topbar('💡 Danke!')}<div class="scroll"><div class="card center"><div style="font-size:56px" aria-hidden="true">💌</div><h2>Danke für deine Nachricht!</h2><p>Sie ist angekommen. Vielleicht steht deine Idee bald unter „Was ist neu?“.</p></div></div><div class="bottom"><button class="btn" id="back">Zurück</button></div></div>`);
        $('#back').onclick = () => back();
      } catch (e) {
        sending = false; $('#fbsend').disabled = false; $('#fbsend').textContent = '📨 Nochmal versuchen';
        $('#fbmsg').innerHTML = `Das hat nicht geklappt – bist du mit dem Internet verbunden? Dein Text bleibt hier stehen. <a href="${esc(formLink())}" target="_blank" rel="noopener">Oder im Formular senden ↗</a>`;
      }
    };
  }

  screenTitle();
  window.__mq = { get run() { return run; }, get meta() { return meta; }, get mode() { return mode; }, screenMap, screenTitle };
})();

</script>
<script>
/* Offline support + automatic updates (see src/sw.js) */
(function () {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  const BUILD = '54f4994b6cae';
  const loadedAt = Date.now();
  let pending = false;
  function refresh(v) {
    // never loop: reload at most once per new version
    try { if (sessionStorage.getItem('lq-reloaded') === v) return; sessionStorage.setItem('lq-reloaded', v); } catch (e) { }
    location.reload();
  }
  navigator.serviceWorker.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.type !== 'sw-activated' || d.version === BUILD) return;
    // newer version ready: apply now if the app was just opened or is in the
    // background; otherwise wait until it is put away (never mid-battle)
    if (document.hidden || Date.now() - loadedAt < 8000) refresh(d.version); else pending = d.version;
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (pending) refresh(pending); return; }
    // app brought back to the foreground: look for a new version
    navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {});
  });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {}));
})();
</script>
